product_mode: backtest
run_id: backtest-example
time_period:
  mode: month_to_month
  start_year: 2020
  first_month: Jan
  end_year: 2025
  last_month: Dec
assets:
  - symbol: QQQ
    name: Invesco QQQ Trust
    currency: USD
  - symbol: GLD
    name: SPDR Gold Shares
    currency: USD
portfolios:
  - name: Growth 70/30
    weights_pct:
      QQQ: 70
      GLD: 30
  - name: Balanced 50/50
    weights_pct:
      QQQ: 50
      GLD: 50
benchmark:
  symbol: SPY
  name: SPDR S&P 500 ETF Trust
  currency: USD
initial_balance: 10000
rebalancing:
  period: monthly
  calendar_aligned: true

# Default U.S. 3-Month T-Bill convention.
# Normal runs reuse the cached effective annual rate from runs/20260908-0002
# instead of fetching FRED/FDR TB3MS on every execution.
risk_free:
  mode: us_3m_tbill

# Use fixed only for an explicitly requested custom annual RF:
# risk_free:
#   mode: fixed
#   annual_rate_pct: 2.5
