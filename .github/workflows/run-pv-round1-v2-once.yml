name: Run PV round-one Year-to-Year v2 once

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/run-pv-round1-v2-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate focused regression
        run: |
          pytest -q tests/test_backtest_pv_round1.py tests/test_backtest_execution.py tests/test_backtest_shared_end_to_end.py

      - name: Validate input
        run: portfolio-optimizer validate configs/backtest-pv-reference-parity.yaml

      - name: Execute Year-to-Year v2 backtest
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          portfolio-optimizer run configs/backtest-pv-reference-parity.yaml --output-root runs | tee /tmp/pv-v2.log
          RUN_PATH="$(tail -n 1 /tmp/pv-v2.log | tr -d '\r')"
          test -d "$RUN_PATH"
          test -f "$RUN_PATH/result.json"
          test -f "$RUN_PATH/report.html"
          test -f "$RUN_PATH/raw/risk_and_return_metrics.csv"
          test -f "$RUN_PATH/raw/annual_returns_detail.csv"
          test -f "$RUN_PATH/raw/monthly_returns_detail.csv"
          echo "run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"

      - name: Compare PV metric targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          run = Path("runs/20260903-backtest-pv-reference-parity-yty-v2")
          metrics = pd.read_csv(run / "raw/risk_and_return_metrics.csv").set_index("metric")
          result = json.loads((run / "result.json").read_text(encoding="utf-8"))
          coverage = result.get("data_coverage", {}).get("backtest_monthly_returns", {})
          print("coverage", coverage)
          assert coverage.get("end") == "2026-08-31", coverage
          assert coverage.get("observations") == 80, coverage

          targets = {
              "Arithmetic Mean (monthly)": [1.03, 1.70, 1.65, 1.33],
              "Arithmetic Mean (annualized)": [13.08, 22.41, 21.67, 17.15],
              "Geometric Mean (monthly)": [0.97, 1.57, 1.53, 1.21],
              "Geometric Mean (annualized)": [12.23, 20.62, 19.97, 15.52],
              "Standard Deviation (monthly)": [3.58, 5.04, 4.92, 4.89],
              "Standard Deviation (annualized)": [12.40, 17.45, 17.06, 16.94],
              "Maximum Drawdown": [-22.25, -22.30, -20.06, -23.93],
              "Benchmark Correlation": [0.91, 0.82, 0.89, 1.00],
              "Beta(*)": [0.67, 0.85, 0.89, 1.00],
              "Active Return": [-3.28, 5.10, 4.45, None],
              "Tracking Error": [7.56, 10.28, 8.04, None],
              "Information Ratio": [-0.43, 0.50, 0.55, None],
          }
          columns = ["Sample Portfolio", "Portfolio 2", "Portfolio 3", "benchmark"]
          lines = [
              "# PV round-one metric comparison",
              "",
              f"Coverage: {coverage.get('start')} to {coverage.get('end')} ({coverage.get('observations')} observations)",
              "",
              "| Metric | Series | PV target | Ours | Difference |",
              "| --- | --- | ---: | ---: | ---: |",
          ]
          for metric, expected in targets.items():
              unit = str(metrics.loc[metric, "unit"])
              for column, target in zip(columns, expected):
                  value = metrics.loc[metric, column]
                  actual = None if pd.isna(value) else float(value)
                  if target is None:
                      shown = "N/A" if actual is None else f"{actual:.4f}"
                      lines.append(f"| {metric} | {column} | N/A | {shown} |  |")
                      continue
                  if unit == "pct":
                      shown_actual = actual * 100.0
                      diff = shown_actual - target
                  else:
                      shown_actual = actual
                      diff = shown_actual - target
                  lines.append(f"| {metric} | {column} | {target:.2f} | {shown_actual:.2f} | {diff:+.2f} |")
          (run / "pv-round1-metric-comparison.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))

          # Core return/risk semantics should be very close before publishing.
          for metric in (
              "Arithmetic Mean (monthly)",
              "Arithmetic Mean (annualized)",
              "Geometric Mean (monthly)",
              "Geometric Mean (annualized)",
              "Standard Deviation (monthly)",
              "Standard Deviation (annualized)",
              "Maximum Drawdown",
          ):
              unit = str(metrics.loc[metric, "unit"])
              for column, target in zip(columns, targets[metric]):
                  value = float(metrics.loc[metric, column])
                  actual = value * 100.0 if unit == "pct" else value
                  assert abs(actual - target) <= 0.35, (metric, column, target, actual)
          PY

      - name: Validate generated HTML contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("runs/20260903-backtest-pv-reference-parity-yty-v2/report.html").read_text(encoding="utf-8")
          required = [
              "Annualized Return (CAGR)",
              "Risk and Return Metrics",
              "Active Return Contribution",
              'id="annual-returns-detail"',
              'id="monthly-returns-detail"',
              'data-chart="drawdown-combined"',
              "drawdown-episodes-panel",
              "pointerX - tipWidth - 12",
          ]
          for marker in required:
              assert marker in html, marker
          assert "Benchmark Summary" not in html
          assert "drawdown-panel" not in html
          assert html.index("Portfolio Risk Decomposition") < html.index("Annual Asset Returns")
          PY

      - name: Commit generated run
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_PATH"
          git commit -m "runs: add PV round-one Year-to-Year v2"
          git pull --rebase origin bt-module
          git push origin HEAD:bt-module
