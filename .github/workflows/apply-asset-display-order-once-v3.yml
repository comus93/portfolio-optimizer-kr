name: Apply asset display order once v3

on:
  push:
    branches: [bt-module]
    paths:
      - .github/workflows/apply-asset-display-order-once-v3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reuse validated v2 patch recipe
        shell: bash
        run: |
          python -m pip install pyyaml
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/apply-asset-display-order-once-v2.yml').read_text(encoding='utf-8')
          )
          steps = workflow['jobs']['apply']['steps']

          def run_named(name: str) -> None:
              step = next(step for step in steps if step.get('name') == name)
              subprocess.run(step['run'], shell=True, executable='/bin/bash', check=True)

          run_named('Patch presentation components')
          run_named('Add regression contract')

          path = Path('tests/test_asset_display_order_contract.py')
          text = path.read_text(encoding='utf-8')
          old = '''    labels = [f"{NAMES[ticker]} ({ticker})" for ticker in EXPECTED]
              assert [html.index(label) for label in labels] == sorted(html.index(label) for label in labels)
              colors = ad.asset_color_map(EXPECTED)
          '''
          new = '''    legend = html.split('<div class="legend">', 1)[1].split('</div>', 1)[0]
              positions = [legend.index(f"({ticker})") for ticker in EXPECTED]
              assert positions == sorted(positions)
              colors = ad.asset_color_map(EXPECTED)
          '''
          if old not in text:
              raise SystemExit('legend assertion contract not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install and test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src/portfolio_optimizer_kr
          python -m pytest -q \
            tests/test_asset_display_order_contract.py \
            tests/test_backtest_pv_round1.py \
            tests/test_pv_pagination_contract.py \
            tests/test_active_visual_reference_contract.py \
            tests/test_backtest_execution.py \
            tests/test_backtest_shared_end_to_end.py
      - name: Generate v6
        shell: bash
        run: |
          portfolio-optimizer validate configs/backtest-pv-reference-parity.yaml
          portfolio-optimizer run configs/backtest-pv-reference-parity.yaml --output-root runs
          test -f runs/20260903-backtest-pv-reference-parity-yty-v6/report.html
      - name: Browser validate
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          expected = ["QQQ", "SPY", "GLD", "XLE", "TLT", "AIA", "SLV", "XLF", "INDY", "EWJ", "EWY", "GDX"]
          url = 'http://127.0.0.1:8000/runs/20260903-backtest-pv-reference-parity-yty-v6/report.html'
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1200})
              page.goto(url, wait_until='networkidle')

              allocation = page.locator('#allocation-matrix tbody tr td:first-child').all_inner_texts()
              assert [next(t for t in expected if f'({t})' in row) for row in allocation] == expected

              for table_id in ('annual-returns-detail', 'monthly-returns-detail'):
                  headers = page.locator(f'#{table_id} thead tr:first-child th').all_inner_texts()
                  assets = [next(t for t in expected if f'({t})' in text) for text in headers if any(f'({t})' in text for t in expected)]
                  assert assets == expected

              corr_rows = page.locator('#correlations-heatmap tbody tr td:first-child').all_inner_texts()
              assert corr_rows == expected
              corr_headers = page.locator('#correlations-heatmap thead th').all_inner_texts()
              assert corr_headers[2:14] == expected
              wrap = page.locator('.correlation-wrap')
              assert wrap.evaluate('(el) => el.scrollWidth <= el.clientWidth + 1')
              page.set_viewport_size({"width": 850, "height": 1200})
              assert wrap.evaluate('(el) => el.scrollWidth > el.clientWidth + 20')
              page.set_viewport_size({"width": 1440, "height": 1200})

              assert page.locator('#portfolio-assets tbody tr td:first-child').all_inner_texts() == expected
              assert page.locator('#portfolio-return-decomposition tbody tr td:first-child').all_inner_texts() == expected
              assert page.locator('#portfolio-risk-decomposition tbody tr td:first-child').all_inner_texts() == expected

              annual_items = page.locator('#assets .asset-annual-responsive .legend-item').all()
              annual_order = []
              annual_colors = {}
              for item in annual_items:
                  text = item.inner_text()
                  ticker = next(t for t in expected if f'({t})' in text)
                  annual_order.append(ticker)
                  annual_colors[ticker] = item.locator('i').evaluate('(el) => el.style.background')
              assert annual_order == expected

              sample_items = page.locator('.active-contribution-panel[data-portfolio="Sample Portfolio"] .legend-item').all()
              sample_order = []
              for item in sample_items:
                  text = item.inner_text()
                  ticker = next(t for t in expected if f'({t})' in text)
                  sample_order.append(ticker)
                  assert item.locator('i').evaluate('(el) => el.style.background') == annual_colors[ticker]
              assert sample_order == ["SPY", "GLD", "TLT"]
              browser.close()
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/portfolio_optimizer_kr/viewer/asset_display.py \
            src/portfolio_optimizer_kr/viewer/backtest_renderer.py \
            src/portfolio_optimizer_kr/viewer/pv_visual.py \
            src/portfolio_optimizer_kr/viewer/historical_active_components.py \
            src/portfolio_optimizer_kr/viewer/pv_round1_overlay.py \
            tests/test_asset_display_order_contract.py \
            configs/backtest-pv-reference-parity.yaml \
            runs/20260903-backtest-pv-reference-parity-yty-v6
          git commit -m 'viewer: unify asset order colors and correlation width'
          git pull --rebase origin bt-module
          git push origin HEAD:bt-module
