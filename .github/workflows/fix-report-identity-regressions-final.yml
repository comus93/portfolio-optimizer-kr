name: Fix report identity regressions final

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-report-identity-regressions-final.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Patch report presentation regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}\n{old[:160]}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace(
              "src/portfolio_optimizer_kr/report/public_links.py",
              'return [cell.strip() for cell in stripped[1:-1].split(" | ")]\n',
              'return [cell.strip() for cell in stripped[1:-1].split("|")]\n',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              'import pandas as pd\n\nfrom . import historical_active_components as active\n',
              'import pandas as pd\nimport yaml\n\nfrom . import asset_display as ad\nfrom . import historical_active_components as active\n',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              'def _rename_identities(frame: pd.DataFrame, labels: dict[str, str]) -> pd.DataFrame:\n',
              '''def _asset_names(root: Path) -> dict[str, str]:\n    path = root / "input.yaml"\n    if not path.is_file():\n        return {}\n    try:\n        loaded = yaml.safe_load(path.read_text(encoding="utf-8"))\n    except (OSError, UnicodeError, yaml.YAMLError):\n        return {}\n    configuration = loaded if isinstance(loaded, dict) else {}\n    return ad.asset_names_from_configuration(configuration)\n\n\ndef _rename_identities(frame: pd.DataFrame, labels: dict[str, str]) -> pd.DataFrame:\n''',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              '    portfolio_order = [labels["provided"], labels["optimized"]]\n\n    performance = ',
              '    portfolio_order = [labels["provided"], labels["optimized"]]\n    asset_names = _asset_names(root)\n\n    performance = ',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              'add("#asset-correlations .table-slot", not correlations.empty, _correlations_table(correlations, benchmark_label))',
              'add("#asset-correlations .table-slot", not correlations.empty, _correlations_table(correlations, benchmark_label, asset_names))',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              'add("#portfolio-asset-correlations .table-slot", not correlations.empty, _correlations_table(correlations, benchmark_label))',
              'add("#portfolio-asset-correlations .table-slot", not correlations.empty, _correlations_table(correlations, benchmark_label, asset_names))',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              'add("#annual-asset-returns .chart", not annual_assets.empty, _annual_asset_returns_chart(annual_assets) + hc.annual_asset_returns_table(annual_assets))',
              'add("#annual-asset-returns .chart", not annual_assets.empty, _annual_asset_returns_chart(annual_assets, asset_names) + hc.annual_asset_returns_table(annual_assets, asset_names))',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py",
              'add("#active-return-contribution .chart", not active_contribution.empty, active.active_contribution(active_contribution, portfolio_order))',
              'add("#active-return-contribution .chart", not active_contribution.empty, active.active_contribution(active_contribution, portfolio_order, asset_names))',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/historical_components.py",
              '''def annual_asset_returns_table(frame: pd.DataFrame) -> str:\n    return friendly_table(frame, fraction_columns={"return"}, table_id="annual-asset-returns-table")\n''',
              '''def annual_asset_returns_table(\n    frame: pd.DataFrame,\n    asset_names: dict[str, str] | None = None,\n) -> str:\n    if frame.empty:\n        return '<p class="muted">N/A</p>'\n    rendered = frame.copy()\n    if "ticker" in rendered:\n        rendered["ticker"] = rendered["ticker"].astype(str)\n        names = asset_names or {}\n        if "name" not in rendered:\n            ticker_index = list(rendered.columns).index("ticker")\n            rendered.insert(\n                ticker_index + 1,\n                "name",\n                rendered["ticker"].map(lambda ticker: names.get(str(ticker), "")),\n            )\n        elif names:\n            rendered["name"] = rendered.apply(\n                lambda row: str(row.get("name") or names.get(str(row.get("ticker")), "")),\n                axis=1,\n            )\n    return friendly_table(\n        rendered,\n        fraction_columns={"return"},\n        table_id="annual-asset-returns-table",\n    )\n''',
          )
          replace(
              "site/report-template.html",
              'th:first-child,td:first-child{text-align:left}\n',
              'th:first-child,td:first-child{text-align:left}\n    #frontier-portfolios th{white-space:pre-line;line-height:1.3;text-align:center;vertical-align:bottom}\n',
          )
          replace(
              "site/report-template.html",
              "...weightKeys.map(key=>({key,label:key.slice(7,-4),format:pct})),",
              "...weightKeys.map(key=>{const ticker=key.slice(7,-4);const asset=(data.tables?.optimization_results||[]).find(row=>String(row.ticker)===ticker);const name=String(asset?.name||'').trim();return {key,label:name?`${name}\\n(${ticker})`:ticker,format:pct};}),",
          )
          PY
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Run affected regression tests
        run: |
          python -m compileall -q src/portfolio_optimizer_kr/report src/portfolio_optimizer_kr/viewer
          pytest -q \
            tests/test_report_identity_regressions.py \
            tests/test_run_navigation.py \
            tests/test_asset_display_order_contract.py \
            tests/test_backtest_report_presentation.py \
            tests/test_backtest_report_content_contract.py
      - name: Regenerate current report and navigation
        run: |
          python - <<'PY'
          from portfolio_optimizer_kr.viewer import generate_report
          generate_report('runs/20260910-0006')
          PY
          python - <<'PY'
          from pathlib import Path
          lines = Path('runs/README.md').read_text(encoding='utf-8').splitlines()
          header = '| Run | Product | Study / Experiment | Period | Benchmark | Report | Summary |'
          index = lines.index(header)
          assert lines[index + 1] == '| --- | --- | --- | --- | --- | --- | --- |'
          report = Path('runs/20260910-0006/report.html').read_text(encoding='utf-8')
          for name in ('Invesco QQQ Trust', 'SPDR Gold Shares', 'ACE 아시아TOP50'):
              assert name in report
          PY
      - name: Commit fixes and regenerated presentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/fix-report-identity-regressions-once.yml \
            .github/workflows/fix-report-identity-regressions-retry.yml \
            .github/workflows/fix-report-identity-regressions-final.yml
          git add \
            src/portfolio_optimizer_kr/report/public_links.py \
            src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py \
            src/portfolio_optimizer_kr/viewer/historical_components.py \
            site/report-template.html \
            tests/test_report_identity_regressions.py \
            runs/README.md \
            runs/20260910-0006/report.html \
            runs/20260910-0006/README.md
          git commit -m "fix: restore report asset identities and run index markdown"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Republish reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-reports.yml --ref main
