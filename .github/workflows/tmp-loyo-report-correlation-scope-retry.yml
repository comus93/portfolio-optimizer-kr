name: Temporary LOYO report correlation scope retry

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-loyo-report-correlation-scope-retry.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Reapply validated patch script
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap
          source = Path('.github/workflows/tmp-loyo-report-correlation-scope.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          body = source.split(marker, 1)[1].split("\n          PY", 1)[0]
          exec(compile(textwrap.dedent(body), '<scoped-patch>', 'exec'))
          PY
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Run targeted regression
        run: uv run pytest -q tests/test_loyo_report_correlation_scope.py tests/test_reporting.py tests/test_loyo_robustness.py
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portfolio_optimizer_kr/pipeline.py docs/report-ui-specification.md openspec/specs/portfolio-analytics/spec.md openspec/changes/2026-09-14-loyo-report-correlation-scope tests/test_loyo_report_correlation_scope.py
          git add -f site/report-template.html
          git commit -m "fix: report LOYO and keep optimization correlations asset-only"
          git push origin HEAD:main
