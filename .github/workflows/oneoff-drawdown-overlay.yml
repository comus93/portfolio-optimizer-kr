name: One-off drawdown overlay implementation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-drawdown-overlay.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply implementation
        run: python scripts/oneoff_drawdown_overlay_fix.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run affected Python regression
        run: |
          python -m compileall -q src/portfolio_optimizer_kr tests
          pytest -q \
            tests/test_drawdown_elasticity.py \
            tests/test_backtest_report_content_contract.py \
            tests/test_backtest_pv_round1.py \
            tests/test_backtest_shared_end_to_end.py \
            tests/test_shared_historical_capabilities.py \
            tests/test_optimizer_shared_historical_mount.py

      - name: Generate representative reports for browser validation
        run: |
          mkdir -p .tmp-validation
          python - <<'PY'
          from portfolio_optimizer_kr.viewer import generate_report
          generate_report('runs/20260911-0005', output_path='.tmp-validation/optimization-report.html')
          generate_report('runs/20260910-0004', output_path='.tmp-validation/backtest-report.html')
          PY
          grep -q 'data-chart="drawdown-comparison"' .tmp-validation/optimization-report.html
          grep -q 'data-chart="drawdown-comparison"' .tmp-validation/backtest-report.html
          test "$(grep -o 'data-chart="drawdown-comparison"' .tmp-validation/optimization-report.html | wc -l)" -eq 1
          test "$(grep -o 'data-chart="drawdown-comparison"' .tmp-validation/backtest-report.html | wc -l)" -eq 1

      - name: Install browser validation dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate Optimization overlay interaction
        env:
          DRAWDOWN_REPORT_PATH: .tmp-validation/optimization-report.html
          DRAWDOWN_SECTION: '#drawdown-chart'
        run: npx playwright test verification/browser/drawdown-overlay.spec.mjs

      - name: Validate Backtest overlay interaction
        env:
          DRAWDOWN_REPORT_PATH: .tmp-validation/backtest-report.html
          DRAWDOWN_SECTION: '#drawdowns'
        run: npx playwright test verification/browser/drawdown-overlay.spec.mjs

      - name: Validate Backtest report contract
        env:
          BACKTEST_REPORT_PATH: .tmp-validation/backtest-report.html
        run: npx playwright test verification/browser/backtest-report-content.spec.mjs

      - name: Complete OpenSpec implementation tasks
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('openspec/changes/2026-09-11-drawdown-recovery-episodes/tasks.md')
          text = path.read_text(encoding='utf-8')
          for task in [
              'shared Drawdowns를 single overlay chart + selectable foreground series 구조로 변경',
              '선택 portfolio 기준 탄성회복도 + Worst Drawdowns detail 전환 검증',
              'Optimization/Backtest unit/browser affected regression 실행',
          ]:
              text = text.replace(f'- [ ] {task}', f'- [x] {task}')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .tmp-validation playwright-report test-results
          git rm scripts/oneoff_drawdown_overlay_fix.py .github/workflows/oneoff-drawdown-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests verification openspec
          git commit -m "feat: unify selectable drawdown comparison"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run run-optimization.yml --ref main
