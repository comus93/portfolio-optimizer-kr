name: Correct report feedback acceptance

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/fix-report-feedback-workflow.yml"

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - name: Correct benchmark-as-constituent assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-report-feedback.yml')
          text = p.read_text(encoding='utf-8')
          old = '    assert html.escape(BENCHMARK) not in rendered\\n'
          new = '    assert "<th>benchmark</th>" not in rendered\\n    assert "<th>Growth 70/30</th>" not in rendered\\n    assert "SPDR S&amp;P 500 ETF Trust" in rendered\\n'
          if text.count(old) != 1:
              raise SystemExit('acceptance assertion anchor changed')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-report-feedback-workflow.yml
          git add .github/workflows/apply-report-feedback.yml
          git commit -m "ci: fix benchmark constituent acceptance"
          git push origin HEAD:bt-module
