name: Temporary integrate LOYO robustness

on:
  push:
    branches: [feature/loyo-robustness-20260914]
    paths:
      - ".github/workflows/tmp-integrate-loyo.yml"

permissions:
  contents: write

jobs:
  integrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/loyo-robustness-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          activate-environment: true
      - name: Sync test environment
        run: uv sync --frozen --extra dev
      - name: Patch default Optimization execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/portfolio_optimizer_kr/runner.py")
          text = path.read_text(encoding="utf-8")

          old_import = "from portfolio_optimizer_kr.pipeline import analyze_prices\n"
          new_import = (
              "from portfolio_optimizer_kr.pipeline import analyze_prices\n"
              "from portfolio_optimizer_kr.optimize.robustness import attach_loyo_robustness\n"
          )
          if old_import not in text:
              raise SystemExit("runner analyze_prices import not found")
          text = text.replace(old_import, new_import, 1)

          old_block = '''    elif using_default_analyzer and spec.product_mode is ProductMode.OPTIMIZATION:\n        result = analyze_fn(\n            request,\n            prices,\n            usdkrw=usdkrw,\n            annual_rf=effective_annual_rf,\n            prepared_data=prepared_optimization,\n        )\n'''
          new_block = '''    elif using_default_analyzer and spec.product_mode is ProductMode.OPTIMIZATION:\n        result = analyze_fn(\n            request,\n            prices,\n            usdkrw=usdkrw,\n            annual_rf=effective_annual_rf,\n            prepared_data=prepared_optimization,\n        )\n        if prepared_optimization is None or effective_annual_rf is None:\n            raise RuntimeError("default Optimization execution requires prepared data and risk-free rate")\n        result = attach_loyo_robustness(\n            result,\n            request,\n            prepared_optimization.monthly_returns,\n            annual_rf=float(effective_annual_rf),\n        )\n'''
          if old_block not in text:
              raise SystemExit("default Optimization execution block not found")
          path.write_text(text.replace(old_block, new_block, 1), encoding="utf-8")
          PY
      - name: Run LOYO affected regression
        run: |
          python -m pytest -q \
            tests/test_loyo_robustness.py \
            tests/test_optimizer.py \
            tests/test_optimization_engine.py \
            tests/test_target_volatility_contract.py \
            tests/test_reporting.py
      - name: Commit runner integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portfolio_optimizer_kr/runner.py
          git commit -m "feat: attach LOYO robustness to optimization runs"
          git pull --rebase origin feature/loyo-robustness-20260914
          git push origin HEAD:feature/loyo-robustness-20260914
