name: Fix backtest detail asset identity

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/fix-backtest-detail-identity.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply detail header fix and regression assertion
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/portfolio_optimizer_kr/viewer/pv_round1_overlay.py')
          text = path.read_text(encoding='utf-8')
          old = '''    for ticker in tickers:\n        name = asset_names.get(ticker, "").strip()\n        label = f"{name} ({ticker})" if name else ticker\n        top.append(f'<th rowspan="2">{hc.esc(label)}</th>')\n'''
          new = '''    for ticker in tickers:\n        name = asset_names.get(ticker, "").strip()\n        label = ad.asset_identity_label(name, ticker)\n        label_html = hc.esc(label).replace("\\n", "<br>")\n        top.append(f'<th rowspan="2">{label_html}</th>')\n'''
          if text.count(old) != 1:
              raise SystemExit('pv_round1_overlay detail header anchor changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_backtest_pv_round1.py')
          body = test.read_text(encoding='utf-8')
          old_test = '''    assert 'id="annual-returns-detail"' in html\n    assert 'id="monthly-returns-detail"' in html\n    assert 'data-chart="drawdown-combined"' in html\n'''
          new_test = '''    assert 'id="annual-returns-detail"' in html\n    assert 'id="monthly-returns-detail"' in html\n    assert '<th rowspan="2">Asset A<br>(A)</th>' in html\n    assert '<th rowspan="2">Asset B<br>(B)</th>' in html\n    assert 'Asset A (A)' not in html\n    assert 'Asset B (B)' not in html\n    assert 'data-chart="drawdown-combined"' in html\n'''
          if body.count(old_test) != 1:
              raise SystemExit('test_backtest_pv_round1 assertion anchor changed')
          test.write_text(body.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused report regression
        run: |
          python -m pytest -q \
            tests/test_backtest_pv_round1.py \
            tests/test_backtest_report_content_contract.py \
            tests/test_backtest_report_presentation.py \
            tests/test_backtest_execution.py

      - name: Commit source and tests only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: wrap asset identity in return detail headers"
          git push origin HEAD:bt-module
