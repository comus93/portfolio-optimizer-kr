name: One-off drawdown static details

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-drawdown-static-details.yml'
      - 'scripts/oneoff_drawdown_static_details.py'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply implementation
        run: python scripts/oneoff_drawdown_static_details.py

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run affected Python regression
        run: |
          python -m compileall -q src/portfolio_optimizer_kr tests
          pytest -q \
            tests/test_drawdown_elasticity.py \
            tests/test_backtest_report_content_contract.py \
            tests/test_backtest_pv_round1.py \
            tests/test_backtest_shared_end_to_end.py \
            tests/test_shared_historical_capabilities.py \
            tests/test_optimizer_shared_historical_mount.py

      - name: Generate representative reports for browser validation
        run: |
          mkdir -p .tmp-validation
          python - <<'PY'
          from pathlib import Path
          from portfolio_optimizer_kr.viewer import generate_report
          opt = generate_report('runs/20260911-0006', output_path='.tmp-validation/optimization-report.html')
          bt = generate_report('runs/20260910-0004', output_path='.tmp-validation/backtest-report.html')
          opt_html = Path(opt).read_text(encoding='utf-8')
          bt_html = Path(bt).read_text(encoding='utf-8')
          assert 'drawdown-comparison' in opt_html
          assert 'data-chart="drawdown-comparison"' in bt_html
          for html in (opt_html, bt_html):
              assert 'drawdown-resilience-table' in html
              assert 'opacity:.58' in html
              assert '#2563eb' in html and '#16a34a' in html and '#f97316' in html
          PY

      - name: Install browser validation dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate Optimization drawdown comparison
        env:
          DRAWDOWN_REPORT_PATH: .tmp-validation/optimization-report.html
          DRAWDOWN_SECTION: '#drawdown-chart'
        run: npx playwright test verification/browser/drawdown-overlay.spec.mjs

      - name: Validate Backtest drawdown comparison
        env:
          DRAWDOWN_REPORT_PATH: .tmp-validation/backtest-report.html
          DRAWDOWN_SECTION: '#drawdowns'
        run: npx playwright test verification/browser/drawdown-overlay.spec.mjs

      - name: Complete affected regression task
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('openspec/changes/2026-09-11-drawdown-recovery-episodes/tasks.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '- [ ] Optimization/Backtest affected regression 및 대표 Optimization report 재생성',
              '- [x] Optimization/Backtest affected regression 및 대표 Optimization report 재생성',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit implementation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .tmp-validation playwright-report test-results
          git rm scripts/oneoff_drawdown_static_details.py .github/workflows/oneoff-drawdown-static-details.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests verification openspec
          git commit -m "fix: clarify drawdown comparison details"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run run-optimization.yml --ref main
