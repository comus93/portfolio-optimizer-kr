name: Run PV round-one Year-to-Year v3 once

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/run-pv-round1-v3-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate focused regression
        run: |
          pytest -q \
            tests/test_backtest_pv_round1.py \
            tests/test_pv_metric_parity.py \
            tests/test_pv_pagination_contract.py \
            tests/test_backtest_execution.py \
            tests/test_backtest_shared_end_to_end.py

      - name: Validate input
        run: portfolio-optimizer validate configs/backtest-pv-reference-parity.yaml

      - name: Execute Year-to-Year v3 backtest
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          portfolio-optimizer run configs/backtest-pv-reference-parity.yaml --output-root runs | tee /tmp/pv-v3.log
          RUN_PATH="$(tail -n 1 /tmp/pv-v3.log | tr -d '\r')"
          test "$RUN_PATH" = "runs/20260903-backtest-pv-reference-parity-yty-v3"
          test -d "$RUN_PATH"
          test -f "$RUN_PATH/result.json"
          test -f "$RUN_PATH/report.html"
          test -f "$RUN_PATH/raw/risk_and_return_metrics.csv"
          test -f "$RUN_PATH/raw/annual_returns_detail.csv"
          test -f "$RUN_PATH/raw/monthly_returns_detail.csv"
          echo "run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"

      - name: Compare complete PV metric targets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import math
          import pandas as pd

          run = Path("runs/20260903-backtest-pv-reference-parity-yty-v3")
          metrics = pd.read_csv(run / "raw/risk_and_return_metrics.csv").set_index("metric")
          result = json.loads((run / "result.json").read_text(encoding="utf-8"))
          coverage = result.get("data_coverage", {}).get("backtest_monthly_returns", {})
          assert coverage.get("start") == "2020-01-31", coverage
          assert coverage.get("end") == "2026-08-31", coverage
          assert coverage.get("observations") == 80, coverage

          targets = {
              "Arithmetic Mean (monthly)": [1.03, 1.70, 1.65, 1.33],
              "Arithmetic Mean (annualized)": [13.08, 22.41, 21.67, 17.15],
              "Geometric Mean (monthly)": [0.97, 1.57, 1.53, 1.21],
              "Geometric Mean (annualized)": [12.23, 20.62, 19.97, 15.52],
              "Standard Deviation (monthly)": [3.58, 5.04, 4.92, 4.89],
              "Standard Deviation (annualized)": [12.40, 17.45, 17.06, 16.94],
              "Downside Deviation (monthly)": [2.17, 2.85, 2.84, 2.95],
              "Maximum Drawdown": [-22.25, -22.30, -20.06, -23.93],
              "Benchmark Correlation": [0.91, 0.82, 0.89, 1.00],
              "Beta(*)": [0.67, 0.85, 0.89, 1.00],
              "Alpha (annualized)": [1.71, 6.91, 5.53, 0.00],
              "R2": [83.32, 67.50, 78.89, 100.00],
              "Sharpe Ratio": [0.77, 1.01, 0.99, 0.77],
              "Sortino Ratio": [1.21, 1.72, 1.67, 1.24],
              "Treynor Ratio (%)": [14.24, 20.74, 18.94, 13.09],
              "Calmar Ratio": [3.06, 3.91, 3.16, 2.76],
              "Modigliani–Modigliani Measure": [15.88, 19.91, 19.67, 15.93],
              "Active Return": [-3.28, 5.10, 4.45, None],
              "Tracking Error": [7.56, 10.28, 8.04, None],
              "Information Ratio": [-0.43, 0.50, 0.55, None],
              "Skewness": [-0.43, -0.29, -0.43, -0.34],
              "Excess Kurtosis": [-0.28, 0.07, -0.06, 0.19],
              "Historical Value-at-Risk (5%)": [5.48, 7.74, 7.93, 7.93],
              "Analytical Value-at-Risk (5%)": [4.95, 6.69, 6.45, 6.72],
              "Conditional Value-at-Risk (5%)": [6.70, 9.30, 9.42, 9.68],
              "Upside Capture Ratio (%)": [68.72, 102.10, 102.57, 100.00],
              "Downside Capture Ratio (%)": [73.31, 81.81, 85.12, 100.00],
              "Safe Withdrawal Rate": [20.34, 23.25, 24.14, 22.61],
              "Perpetual Withdrawal Rate": [8.11, 15.18, 14.67, 11.01],
              "Positive Periods": ["52 out of 80 (65.00%)", "53 out of 80 (66.25%)", "52 out of 80 (65.00%)", "52 out of 80 (65.00%)"],
              "Gain/Loss Ratio": [1.06, 1.18, 1.23, 1.06],
          }
          columns = ["Sample Portfolio", "Portfolio 2", "Portfolio 3", "benchmark"]
          loose_pct = {
              "Arithmetic Mean (annualized)": 0.35,
              "Maximum Drawdown": 0.12,
              "Alpha (annualized)": 0.12,
              "Modigliani–Modigliani Measure": 0.15,
              "Upside Capture Ratio (%)": 0.25,
              "Downside Capture Ratio (%)": 0.25,
              "Safe Withdrawal Rate": 0.18,
              "Perpetual Withdrawal Rate": 0.20,
          }
          ratio_tolerance = {
              "Sharpe Ratio": 0.03,
              "Sortino Ratio": 0.04,
              "Treynor Ratio (%)": 0.35,
              "Calmar Ratio": 0.06,
              "Information Ratio": 0.03,
              "Skewness": 0.03,
              "Excess Kurtosis": 0.03,
              "Gain/Loss Ratio": 0.03,
              "Benchmark Correlation": 0.02,
              "Beta(*)": 0.02,
          }
          lines = [
              "# PV round-one complete metric comparison",
              "",
              f"Coverage: {coverage.get('start')} to {coverage.get('end')} ({coverage.get('observations')} observations)",
              "",
              "| Metric | Series | PV target | Ours | Difference | Status |",
              "| --- | --- | ---: | ---: | ---: | --- |",
          ]
          failures = []
          for metric, expected in targets.items():
              assert metric in metrics.index, metric
              unit = str(metrics.loc[metric, "unit"])
              for column, target in zip(columns, expected):
                  value = metrics.loc[metric, column]
                  if isinstance(target, str):
                      actual = str(value)
                      status = "PASS" if actual == target else "FAIL"
                      lines.append(f"| {metric} | {column} | {target} | {actual} |  | {status} |")
                      if status == "FAIL": failures.append((metric, column, target, actual))
                      continue
                  if target is None:
                      ok = pd.isna(value)
                      shown = "N/A" if ok else str(value)
                      status = "PASS" if ok else "FAIL"
                      lines.append(f"| {metric} | {column} | N/A | {shown} |  | {status} |")
                      if not ok: failures.append((metric, column, None, value))
                      continue
                  actual_raw = float(value)
                  actual = actual_raw * 100.0 if unit == "pct" else actual_raw
                  diff = actual - float(target)
                  if unit == "pct":
                      tolerance = loose_pct.get(metric, 0.12)
                  else:
                      tolerance = ratio_tolerance.get(metric, 0.06)
                  ok = math.isfinite(actual) and abs(diff) <= tolerance
                  status = "PASS" if ok else "FAIL"
                  lines.append(f"| {metric} | {column} | {target:.2f} | {actual:.2f} | {diff:+.2f} | {status} |")
                  if not ok: failures.append((metric, column, target, actual, tolerance))

          comparison = "\n".join(lines) + "\n"
          (run / "pv-round1-complete-metric-comparison.md").write_text(comparison, encoding="utf-8")
          print(comparison)
          assert not failures, failures
          PY

      - name: Validate generated HTML contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path("runs/20260903-backtest-pv-reference-parity-yty-v3/report.html").read_text(encoding="utf-8")
          required = [
              "Annualized Return (CAGR)",
              '<h2>Risk and Return Metrics</h2>',
              "Active Return Contribution",
              'id="annual-returns-detail"',
              'id="monthly-returns-detail"',
              'id="pv-monthly-pagination-script"',
              '<option value="12" selected>12</option>',
              'data-action="first"',
              'data-action="prev"',
              'data-action="next"',
              'data-action="last"',
              'data-chart="drawdown-combined"',
              "drawdown-episodes-panel",
              "pointerX - tipWidth - 12",
          ]
          for marker in required:
              assert marker in html, marker
          assert "Benchmark Summary" not in html
          assert "drawdown-panel" not in html
          assert html.index("Portfolio Risk Decomposition") < html.index("Annual Asset Returns")
          annual_chart = html.index('data-chart="annual-returns-chart"')
          annual_legend = html.find('<div class="legend">', annual_chart)
          assert annual_legend > annual_chart
          assert html.count("active-contribution-panel") == 3
          PY

      - name: Commit generated run
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_PATH"
          git commit -m "runs: add PV round-one Year-to-Year v3"
          git pull --rebase origin bt-module
          git push origin HEAD:bt-module
