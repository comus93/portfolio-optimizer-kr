name: Finalize PV v4 pagination contract

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/finalize-pv-round1-v4-final.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Patch renderer by function boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("src/portfolio_optimizer_kr/viewer/pv_round1_overlay.py")
          text=path.read_text(encoding="utf-8")
          start=text.index("def _monthly_detail_table(")
          end=text.index("\n\ndef _combined_drawdowns(",start)
          replacement=r'''def _monthly_detail_table(
              frame: pd.DataFrame,
              portfolio_order: list[str],
              benchmark_label: str | None,
              asset_names: dict[str, str],
              currency: str,
          ) -> str:
              if frame.empty or not {"year", "month"}.issubset(frame.columns):
                  return '<p class="muted">N/A</p>'
              series, tickers = _detail_structure(frame, portfolio_order, asset_names)
              top, second = _detail_header(series, tickers, benchmark_label, asset_names, monthly=True)
              rows: list[str] = []
              rendered = frame.sort_values(["year", "month"], ascending=[False, False])
              for _, row in rendered.iterrows():
                  cells = [
                      f'<td class="identity-cell">{int(row["year"])}</td>',
                      f'<td>{int(row["month"])}</td>',
                  ]
                  for name in series:
                      cells.extend([
                          f'<td>{hc.esc(hc.fraction_pct(row.get(f"series::{name}::return")))}</td>',
                          f'<td>{hc.esc(hc.money(row.get(f"series::{name}::balance"), currency))}</td>',
                      ])
                  for ticker in tickers:
                      cells.append(f'<td>{hc.esc(hc.fraction_pct(row.get(f"asset::{ticker}::return")))}</td>')
                  rows.append(f'<tr>{"".join(cells)}</tr>')
              total_rows=len(rows)
              first_page_end=min(12,total_rows)
              pagination_script="""<script>
          (()=>{
            const table=document.getElementById('monthly-returns-detail');
            const status=document.getElementById('monthly-page-status');
            if(!table||!status||table.dataset.paginationReady==='true')return;
            table.dataset.paginationReady='true';
            const rows=Array.from(table.tBodies[0]?.rows||[]);
            const pageSize=12;
            let page=0;
            const first=document.getElementById('monthly-page-first');
            const previous=document.getElementById('monthly-page-previous');
            const next=document.getElementById('monthly-page-next');
            const last=document.getElementById('monthly-page-last');
            const lastPage=()=>Math.max(0,Math.ceil(rows.length/pageSize)-1);
            const render=()=>{
              page=Math.max(0,Math.min(page,lastPage()));
              const start=page*pageSize;
              const end=Math.min(start+pageSize,rows.length);
              rows.forEach((row,index)=>{
                const hide=index<start||index>=end;
                row.hidden=hide;
                row.style.display=hide?'none':'table-row';
              });
              status.textContent=rows.length?`Showing ${start+1} to ${end} of ${rows.length} entries`:'Showing 0 to 0 of 0 entries';
              if(first)first.disabled=page===0;
              if(previous)previous.disabled=page===0;
              if(next)next.disabled=page>=lastPage();
              if(last)last.disabled=page>=lastPage();
            };
            first?.addEventListener('click',()=>{page=0;render();});
            previous?.addEventListener('click',()=>{page-=1;render();});
            next?.addEventListener('click',()=>{page+=1;render();});
            last?.addEventListener('click',()=>{page=lastPage();render();});
            render();
          })();
          </script>"""
              return (
                  '<p class="panel-subtitle">Monthly returns for the configured portfolios</p>'
                  '<div class="pv-table-page-size" style="display:flex;align-items:center;gap:6px;margin:8px 0">'
                  '<label for="monthly-page-size">Show</label>'
                  '<select id="monthly-page-size" aria-label="Monthly returns entries per page"><option value="12" selected>12</option></select>'
                  '<span>entries</span></div>'
                  '<div class="table-wrap"><table id="monthly-returns-detail" class="pv-grouped-table wide-detail-table">'
                  f'<thead><tr>{top}</tr><tr>{second}</tr></thead>'
                  f'<tbody>{"".join(rows)}</tbody></table></div>'
                  '<div id="monthly-pagination" class="pv-table-pagination" style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-top:10px">'
                  f'<span id="monthly-page-status">Showing 1 to {first_page_end} of {total_rows} entries</span>'
                  '<span style="display:flex;gap:6px">'
                  '<button type="button" id="monthly-page-first">First</button>'
                  '<button type="button" id="monthly-page-previous">Previous</button>'
                  '<button type="button" id="monthly-page-next">Next</button>'
                  '<button type="button" id="monthly-page-last">Last</button>'
                  '</span></div>'
                  + pagination_script
              )
          '''
          path.write_text(text[:start]+replacement+text[end:],encoding="utf-8")

          Path("tests/test_monthly_returns_pagination_contract.py").write_text('''from __future__ import annotations\nimport pandas as pd\nfrom portfolio_optimizer_kr.viewer import pv_round1_overlay as overlay\n\ndef test_pv_monthly_pagination_contract():\n    frame=pd.DataFrame([{"year":2026,"month":(i%12)+1,"series::P::return":.01,"series::P::balance":100+i,"asset::SPY::return":.02} for i in range(13)])\n    html=overlay._monthly_detail_table(frame,["P"],None,{"SPY":"SPY"},"USD")\n    assert 'Showing 1 to 12 of 13 entries' in html\n    assert "row.style.display=hide?'none':'table-row'" in html\n    for name in ("first","previous","next","last"):\n        assert f'id="monthly-page-{name}"' in html\n''',encoding="utf-8")

          cfg_path=Path("configs/backtest-pv-reference-parity.yaml")
          cfg=cfg_path.read_text(encoding="utf-8")
          if "20260903-backtest-pv-reference-parity-yty-v3" not in cfg:
              raise SystemExit("v3 run id missing")
          cfg_path.write_text(cfg.replace("20260903-backtest-pv-reference-parity-yty-v3","20260903-backtest-pv-reference-parity-yty-v4",1),encoding="utf-8")
          PY

      - name: Test and generate v4
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m compileall -q src/portfolio_optimizer_kr
          python -m pytest -q tests/test_monthly_returns_pagination_contract.py tests/test_backtest_pv_round1.py tests/test_backtest_execution.py tests/test_backtest_shared_end_to_end.py tests/test_active_visual_reference_contract.py
          portfolio-optimizer validate configs/backtest-pv-reference-parity.yaml
          portfolio-optimizer run configs/backtest-pv-reference-parity.yaml --output-root runs

      - name: Static contract check
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("runs/20260903-backtest-pv-reference-parity-yty-v4/report.html").read_text(encoding="utf-8")
          assert 'id="monthly-page-status">Showing 1 to 12 of 80 entries' in html
          assert 'Risk and Return Metrics' in html
          assert 'Annualized Return (CAGR)' in html
          assert 'Active Return Contribution' in html
          assert 'data-chart="drawdown-combined"' in html
          assert 'Benchmark Summary' not in html
          PY

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Browser pagination check
        run: |
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch()
              page=browser.new_page(viewport={"width":1440,"height":1200})
              page.goto("http://127.0.0.1:8000/runs/20260903-backtest-pv-reference-parity-yty-v4/report.html",wait_until="networkidle")
              visible=lambda: page.locator("#monthly-returns-detail tbody tr:visible").count()
              status=lambda: page.locator("#monthly-page-status").inner_text()
              assert page.locator("#monthly-returns-detail tbody tr").count()==80
              assert visible()==12 and status()=="Showing 1 to 12 of 80 entries"
              page.locator("#monthly-page-next").click()
              assert visible()==12 and status()=="Showing 13 to 24 of 80 entries"
              page.locator("#monthly-page-last").click()
              assert visible()==8 and status()=="Showing 73 to 80 of 80 entries"
              assert page.locator("#monthly-page-next").is_disabled()
              page.locator("#monthly-page-first").click()
              assert visible()==12 and status()=="Showing 1 to 12 of 80 entries"
              browser.close()
          PY

      - name: Commit v4 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portfolio_optimizer_kr/viewer/pv_round1_overlay.py tests/test_monthly_returns_pagination_contract.py configs/backtest-pv-reference-parity.yaml runs/20260903-backtest-pv-reference-parity-yty-v4
          git commit -m "viewer: finalize PV round-one v4 pagination"
          git pull --rebase origin bt-module
          git push origin HEAD:bt-module
