name: Apply report P1 polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-report-p1-polish.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inline validated P1 polish
        run: |
          python - <<'PY'
          from pathlib import Path
          template = Path('site/report-template.html')
          fragment = Path('site/report-p1-polish.fragment.html')
          text = template.read_text(encoding='utf-8')
          patch = fragment.read_text(encoding='utf-8').rstrip()
          if 'id="report-p1-polish"' not in text:
              if '</body>' not in text:
                  raise SystemExit('report template missing closing body tag')
              text = text.replace('</body>', patch + '\n</body>', 1)
              template.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/report-template.html
          git rm site/report-p1-polish.fragment.html .github/workflows/apply-report-p1-polish.yml
          git commit -m "fix: complete report P1 fidelity polish"
          git push origin main
