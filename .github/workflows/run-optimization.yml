name: Execute research optimization

on:
  push:
    branches: [main]
    paths:
      - "control/execute.yaml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: research-execution
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read execution switch
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(sha256sum control/execute.yaml | awk '{print $1}')"
          echo "fingerprint=$FINGERPRINT" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual workflow dispatch: forcing execution."
            exit 0
          fi

          if grep -Eq '^[[:space:]]*run:[[:space:]]*true([[:space:]]*#.*)?[[:space:]]*$' control/execute.yaml; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "control/execute.yaml has run: true"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "control/execute.yaml does not request execution; nothing to do."
          fi

      - name: Set up Python
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Execute selected research experiment
        if: steps.gate.outputs.should_run == 'true'
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          portfolio-optimizer execute \
            --repo-root . \
            --control control/execute.yaml \
            --output-root runs | tee /tmp/portfolio-run.log

          RUN_PATH="$(tail -n 1 /tmp/portfolio-run.log | tr -d '\r')"
          if [[ ! -d "$RUN_PATH" ]]; then
            echo "Expected run directory was not created: $RUN_PATH" >&2
            exit 1
          fi

          RUN_ID="$(basename "$RUN_PATH")"
          echo "run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

          test -f "$RUN_PATH/input.yaml"
          test -f "$RUN_PATH/context.yaml"
          test -f "$RUN_PATH/result.json"
          test -f "$RUN_PATH/report.html"
          test -d "$RUN_PATH/review"

      - name: Commit generated run artifacts
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          RUN_ID="${{ steps.execute.outputs.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_PATH"

          if git diff --cached --quiet; then
            echo "No generated run artifacts to commit" >&2
            exit 1
          fi

          git commit -m "runs: add $RUN_ID"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish run to GitHub Pages
        if: steps.gate.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run publish-reports.yml --ref main

      - name: Consume execution request
        if: steps.gate.outputs.should_run == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_FINGERPRINT="${{ steps.gate.outputs.fingerprint }}"

          git fetch origin main
          CURRENT_FINGERPRINT="$(git show origin/main:control/execute.yaml | sha256sum | awk '{print $1}')"

          if [[ "$CURRENT_FINGERPRINT" != "$SOURCE_FINGERPRINT" ]]; then
            echo "A newer execution request exists; leaving control/execute.yaml untouched."
            exit 0
          fi

          git pull --rebase origin main
          CURRENT_FINGERPRINT="$(sha256sum control/execute.yaml | awk '{print $1}')"
          if [[ "$CURRENT_FINGERPRINT" != "$SOURCE_FINGERPRINT" ]]; then
            echo "Execution request changed while synchronizing; leaving it untouched."
            exit 0
          fi

          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("control/execute.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          if payload.get("run") is not True:
              raise SystemExit(0)
          payload["run"] = False
          path.write_text(
              yaml.safe_dump(payload, sort_keys=False, allow_unicode=True),
              encoding="utf-8",
          )
          PY

          if git diff --quiet -- control/execute.yaml; then
            echo "Execution request already consumed."
            exit 0
          fi

          git add control/execute.yaml
          git commit -m "control: consume execution request"

          if ! git push origin HEAD:main; then
            echo "Remote changed before reset push; preserving the newer request."
            exit 0
          fi

      - name: Write run summary
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          RUN_ID="${{ steps.execute.outputs.run_id }}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          PAGE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/runs/${RUN_ID}/report.html"
          {
            echo "## Research run created"
            echo
            echo "- Run ID: \`$RUN_ID\`"
            echo "- Artifact path: \`runs/$RUN_ID/\`"
            echo "- Expected Pages URL: $PAGE_URL"
            echo
            echo "Pages deployment is dispatched after the run commit."
          } >> "$GITHUB_STEP_SUMMARY"
