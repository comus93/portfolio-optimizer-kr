name: One-off milestone 2 baseline tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/oneoff-milestone2-baseline.yml

permissions:
  contents: write

jobs:
  tag_baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify baseline metadata
        run: |
          grep -q "baseline-20260911-milestone-2" README.md
          grep -q "Milestone 2 is complete" docs/milestones/2026-09-11-milestone-2.md
          grep -q "20260911-0007" docs/milestones/2026-09-11-milestone-2.md
          test -z "$(git tag -l baseline-20260911-milestone-2)"

      - name: Finalize commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/oneoff-milestone2-baseline.yml
          git commit -m "chore: finalize milestone 2 baseline marker"
          git pull --rebase origin main
          git push origin HEAD:main
          git tag -a baseline-20260911-milestone-2 -m "Milestone 2 baseline 2026-09-11; representative run 20260911-0007; recovery aggregation and Sweet Spot rules remain follow-up research."
          git push origin refs/tags/baseline-20260911-milestone-2
          git rev-list -n 1 baseline-20260911-milestone-2
