name: Finalize LOYO asset-year influence change

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-loyo-asset-year.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Promote specs, refresh UI contract and handover
        run: python scripts/finalize_loyo_asset_year_change.py

      - name: Archive completed OpenSpec change and remove temporary tooling
        run: |
          mkdir -p openspec/changes/archive
          git mv \
            openspec/changes/2026-09-16-loyo-asset-year-influence-reporting \
            openspec/changes/archive/2026-09-16-loyo-asset-year-influence-reporting
          git rm \
            .github/workflows/validate-loyo-asset-year.yml \
            .github/workflows/backfill-run-0003-loyo-influence.yml \
            .github/workflows/finalize-loyo-asset-year.yml \
            scripts/finalize_loyo_asset_year_change.py

      - name: Commit finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/report-ui-specification.md \
            openspec/specs \
            openspec/changes/archive \
            ai-share/llm-to-llm.md
          git commit -m "spec: promote LOYO asset-year influence reporting"
          git push origin HEAD:main
