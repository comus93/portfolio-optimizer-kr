name: One-off skeleton import

on:
  push:
    paths:
      - '.github/workflows/oneoff-skeleton.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install initial project skeleton
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/skeleton.b64 <<'EOF'

EOF
          base64 -d /tmp/skeleton.b64 > /tmp/skeleton.tar.gz
          tar -xzf /tmp/skeleton.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md pyproject.toml src tests
          git commit -m "Add initial portfolio optimizer skeleton and tests"
          git push
