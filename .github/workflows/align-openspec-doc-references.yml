name: Align OpenSpec source references

on:
  push:
    branches: [bt-module]
    paths:
      - '.github/workflows/align-openspec-doc-references.yml'

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - name: Align remaining docs with OpenSpec finance authority
        shell: python
        run: |
          from pathlib import Path

          changes = {
            'docs/report-ui-specification.md': [
              ('Finance / calculation semantics   docs/specification.md',
               'Finance / calculation semantics   openspec/specs/ + active openspec/changes/'),
            ],
            'docs/visual-acceptance-contract.md': [
              ('Finance / calculation semantics   docs/specification.md',
               'Finance / calculation semantics   openspec/specs/ + active openspec/changes/'),
              ('`docs/specification.md` 기준으로 automated tests를 수행한다.',
               '`openspec/specs/`와 applicable active `openspec/changes/` 기준으로 automated tests를 수행한다.'),
            ],
            'docs/research-operation-pipeline.md': [
              ('금융 계산 공식은 `docs/specification.md`, report UI는 `docs/report-ui-specification.md`, 내부 runtime 구조는 `docs/architecture.md`를 따른다.',
               '금융 계산 및 product semantics는 `openspec/specs/`와 applicable active `openspec/changes/`, report UI의 아직 이관되지 않은 상세 contract는 `docs/report-ui-specification.md`, 내부 runtime 구조는 `docs/architecture.md`를 따른다.'),
            ],
          }
          for path, replacements in changes.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              original = text
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new)
              if text != original:
                  p.write_text(text, encoding='utf-8')

      - name: Commit aligned references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/report-ui-specification.md docs/visual-acceptance-contract.md docs/research-operation-pipeline.md
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "docs: point finance authority to OpenSpec"
            git push origin HEAD:bt-module
          fi
