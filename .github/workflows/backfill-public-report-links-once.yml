name: Backfill public report links once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-public-report-links-once.yml"

permissions:
  contents: write
  pages: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Register existing public report URLs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PAGE_BASE_URL="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"

          while IFS= read -r REPORT_PATH; do
            RUN_PATH="$(dirname "$REPORT_PATH")"
            PUBLIC_REPORT_URL="${PAGE_BASE_URL%/}/${REPORT_PATH#./}"
            python scripts/register_public_report_url.py "$RUN_PATH" "$PUBLIC_REPORT_URL" >/dev/null
          done < <(find runs -mindepth 2 -maxdepth 2 -type f -name report.html | sort)

          python scripts/rebuild_run_navigation.py --include-run-readmes

      - name: Commit publication metadata and navigation
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- runs)" ]; then
            echo "Run publication links already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs
          git commit -m "docs: backfill public run report links"
          git push origin HEAD:main
