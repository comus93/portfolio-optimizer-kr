name: Apply user report feedback v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-user-feedback-v2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed report changes
        run: |
          python .github/apply_user_feedback_v2.py
          python -m py_compile \
            src/portfolio_optimizer_kr/viewer/report_model.py \
            src/portfolio_optimizer_kr/viewer/builder.py \
            src/portfolio_optimizer_kr/pipeline.py \
            src/portfolio_optimizer_kr/report/result.py
          python - <<'PY'
          from pathlib import Path
          html = Path('site/report-template.html').read_text(encoding='utf-8')
          start = html.index('<script id="report-user-feedback-v2">')
          start = html.index('\n', start) + 1
          end = html.index('</script>', start)
          Path('/tmp/report-user-feedback-v2.js').write_text(html[start:end], encoding='utf-8')
          PY
          node --check /tmp/report-user-feedback-v2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/portfolio_optimizer_kr/viewer/report_model.py \
            src/portfolio_optimizer_kr/viewer/builder.py \
            src/portfolio_optimizer_kr/pipeline.py \
            src/portfolio_optimizer_kr/report/result.py
          git add -f site/report-template.html
          git rm \
            .github/apply_user_feedback_v2.py \
            .github/report-user-feedback-v2-part1.txt \
            .github/report-user-feedback-v2-part2.txt \
            .github/report-user-feedback-v2-part3.txt \
            .github/report-user-feedback-v2-part4.txt \
            .github/report-user-feedback-v2-part5.txt \
            .github/workflows/apply-user-feedback-v2.yml
          git commit -m "fix: implement user report review feedback"
          git push origin main
