name: Temporary import Solactive defense index data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-import-solactive-market-data.yml"

permissions:
  contents: write

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Materialize and validate series
        shell: bash
        run: |
          set -euo pipefail
          ROOT="data/market_data/solactive"
          cat "$ROOT/.import-DE000SL0JKC0.part1" "$ROOT/.import-DE000SL0JKC0.part2" "$ROOT/.import-DE000SL0JKC0.part3" "$ROOT/.import-DE000SL0JKC0.part4" "$ROOT/.import-DE000SL0JKC0.part5" > /tmp/raw.b64
          test "$(wc -c < /tmp/raw.b64)" -eq 16436
          base64 -d /tmp/raw.b64 > /tmp/raw.csv.gz
          gzip -t /tmp/raw.csv.gz
          gzip -dc /tmp/raw.csv.gz > "$ROOT/DE000SL0JKC0.raw.csv"
          python - <<'PY'
          from pathlib import Path
          import csv
          from datetime import date, timedelta

          root = Path('data/market_data/solactive')
          raw_path = root / 'DE000SL0JKC0.raw.csv'
          canonical_path = root / 'DE000SL0JKC0.csv'
          rows = []
          with raw_path.open(newline='', encoding='utf-8-sig') as f:
              reader = csv.DictReader(f)
              assert reader.fieldnames == ['date', 'level', 'isin'], reader.fieldnames
              raw_rows = list(reader)

          assert len(raw_rows) == 1920
          assert raw_rows[0] == {'date': '2019-05-06', 'level': '1000.00', 'isin': 'DE000SL0JKC0'}
          assert raw_rows[-1] == {'date': '2026-09-13', 'level': '3679.87', 'isin': 'DE000SL0JKC0'}

          for row in raw_rows:
              d = date.fromisoformat(row['date']) + timedelta(days=1)
              rows.append((d.isoformat(), row['level'], row['isin']))

          assert rows[0] == ('2019-05-07', '1000.00', 'DE000SL0JKC0')
          assert rows[-1] == ('2026-09-14', '3679.87', 'DE000SL0JKC0')
          assert len({d for d, _, _ in rows}) == len(rows)
          assert {isin for _, _, isin in rows} == {'DE000SL0JKC0'}
          assert all(date.fromisoformat(d).weekday() < 5 for d, _, _ in rows)

          with canonical_path.open('w', newline='', encoding='utf-8') as f:
              writer = csv.writer(f, lineterminator='\n')
              writer.writerow(['date', 'level', 'isin'])
              writer.writerows(rows)
          PY

          rm -f "$ROOT/.import-DE000SL0JKC0.b64"
          rm -f "$ROOT/.import-DE000SL0JKC0.part1" "$ROOT/.import-DE000SL0JKC0.part2" "$ROOT/.import-DE000SL0JKC0.part3" "$ROOT/.import-DE000SL0JKC0.part4" "$ROOT/.import-DE000SL0JKC0.part5"
          rm .github/workflows/tmp-import-solactive-market-data.yml

      - name: Commit imported data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/market_data/solactive .github/workflows/tmp-import-solactive-market-data.yml
          git commit -m "data: add Solactive Global Defense Index PR history"
          git pull --rebase origin main
          git push origin HEAD:main
