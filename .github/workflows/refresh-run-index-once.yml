name: Refresh corrected run index once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-run-index-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Refresh public report navigation
        run: |
          python scripts/register_public_report_url.py \
            runs/20260910-0006 \
            https://comus93.github.io/portfolio-optimizer-kr/runs/20260910-0006/report.html
      - name: Commit refreshed navigation
        run: |
          if [ -z "$(git status --porcelain -- runs/README.md runs/20260910-0006)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/README.md runs/20260910-0006/README.md runs/20260910-0006/links.yaml
          git commit -m "docs: refresh run 20260910-0006 report navigation"
          git push origin HEAD:main
