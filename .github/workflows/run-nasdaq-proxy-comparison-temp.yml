name: Run Nasdaq proxy comparison without metadata hydration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/run-nasdaq-proxy-comparison-temp.yml"

permissions:
  contents: write
  actions: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Execute four-portfolio research run
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          portfolio-optimizer execute \
            --repo-root . \
            --control control/execute.yaml \
            --output-root runs | tee /tmp/portfolio-run.log
          RUN_PATH="$(tail -n 1 /tmp/portfolio-run.log | tr -d '\r')"
          test -d "$RUN_PATH"
          test -f "$RUN_PATH/input.yaml"
          test -f "$RUN_PATH/result.json"
          test -f "$RUN_PATH/report.html"
          RUN_ID="$(basename "$RUN_PATH")"
          echo "run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: Commit run and consume request
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          RUN_ID="${{ steps.execute.outputs.run_id }}"
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path("control/execute.yaml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8")) or {}
          payload["run"] = False
          path.write_text(yaml.safe_dump(payload, sort_keys=False, allow_unicode=True), encoding="utf-8")
          PY
          rm .github/workflows/run-nasdaq-proxy-comparison-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_PATH" control/execute.yaml .github/workflows/run-nasdaq-proxy-comparison-temp.yml
          git commit -m "runs: add $RUN_ID Nasdaq proxy comparison"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Publish report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-reports.yml --ref main
      - name: Summary
        run: |
          RUN_ID="${{ steps.execute.outputs.run_id }}"
          echo "Run ID: $RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "https://comus93.github.io/portfolio-optimizer-kr/runs/$RUN_ID/report.html" >> "$GITHUB_STEP_SUMMARY"
