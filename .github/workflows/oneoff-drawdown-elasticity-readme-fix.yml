name: One-off drawdown elasticity and run index fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-drawdown-elasticity-readme-fix.yml'

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply implementation
        run: python scripts/oneoff_drawdown_elasticity_readme_fix.py
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run affected regression
        run: |
          python -m compileall -q src/portfolio_optimizer_kr
          pytest -q tests/test_drawdown_elasticity.py tests/test_run_index_readability.py tests/test_analytics.py tests/test_backtest_report_content_contract.py tests/test_shared_historical_capabilities.py tests/test_optimizer_shared_historical_mount.py tests/test_backtest.py
      - name: Rebuild run index
        run: python scripts/rebuild_run_navigation.py --runs-root runs
      - name: Verify run index
        run: python -c "from pathlib import Path; t=Path('runs/README.md').read_text(encoding='utf-8'); assert '## Latest by Experiment' in t and '## Recent Runs' in t and '<summary>Full Run History (' in t and '| --- | --- | --- | --- | --- | N/A | --- |' not in t"
      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/oneoff-drawdown-elasticity-readme-fix.yml
          rm scripts/oneoff_drawdown_elasticity_readme_fix.py
          git add -A
          git commit -m 'feat: add drawdown elasticity KPI and repair run index'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Regenerate representative Optimization report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-optimization.yml --ref main
