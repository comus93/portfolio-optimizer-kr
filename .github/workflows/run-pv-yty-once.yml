name: Run PV Year-to-Year parity backtest once

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/run-pv-yty-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Validate input
        run: portfolio-optimizer validate configs/backtest-pv-reference-parity.yaml

      - name: Execute Year-to-Year backtest
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          portfolio-optimizer run configs/backtest-pv-reference-parity.yaml --output-root runs | tee /tmp/pv-yty.log
          RUN_PATH="$(tail -n 1 /tmp/pv-yty.log | tr -d '\r')"
          test -d "$RUN_PATH"
          test -f "$RUN_PATH/result.json"
          test -f "$RUN_PATH/report.html"
          echo "run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"

      - name: Commit generated run
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RUN_PATH"
          git commit -m "runs: add PV Year-to-Year parity backtest"
          git pull --rebase origin bt-module
          git push origin HEAD:bt-module
