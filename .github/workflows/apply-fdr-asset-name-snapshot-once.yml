name: Apply FDR asset name snapshot once

on:
  push:
    branches: [bt-module]
    paths:
      - .github/workflows/apply-fdr-asset-name-snapshot-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -q -e '.[dev]'
      - name: Apply implementation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/portfolio_optimizer_kr/data/fdr.py')
          text = p.read_text(encoding='utf-8')
          old = '''    def __init__(self) -> None:\n        self._kr_etf_symbols: set[str] | None = None\n'''
          new = '''    def __init__(self) -> None:\n        self._kr_etf_symbols: set[str] | None = None\n        self._etf_name_maps: dict[str, dict[str, str]] = {}\n'''
          if old not in text:
              raise SystemExit('FDRLoader __init__ anchor not found')
          text = text.replace(old, new, 1)

          anchor = '''    @staticmethod\n    def _split_source(symbol: str) -> tuple[str | None, str]:\n        source, code = symbol.split(":", 1) if ":" in symbol else (None, symbol)\n        return (source.upper() if source else None, code.upper())\n\n'''
          addition = '''    @staticmethod\n    def _split_source(symbol: str) -> tuple[str | None, str]:\n        source, code = symbol.split(":", 1) if ":" in symbol else (None, symbol)\n        return (source.upper() if source else None, code.upper())\n\n    @staticmethod\n    def _listing_identity_columns(listing: pd.DataFrame) -> tuple[str, str]:\n        symbol_column = next(\n            (\n                column\n                for column in ("Symbol", "Code", "Ticker", "symbol", "code", "ticker")\n                if column in listing.columns\n            ),\n            None,\n        )\n        name_column = next(\n            (column for column in ("Name", "name") if column in listing.columns),\n            None,\n        )\n        if symbol_column is None or name_column is None:\n            raise DataValidationError(\n                "FinanceDataReader ETF listing does not expose symbol/name metadata"\n            )\n        return symbol_column, name_column\n\n    def _load_etf_name_map(self, fdr, country: str) -> dict[str, str]:\n        country = country.upper()\n        cached = self._etf_name_maps.get(country)\n        if cached is not None:\n            return cached\n        try:\n            listing = fdr.StockListing(f"ETF/{country}")\n        except Exception as exc:\n            raise DataValidationError(\n                f"unable to load FinanceDataReader ETF/{country} name metadata"\n            ) from exc\n        if listing is None or listing.empty:\n            raise DataValidationError(\n                f"FinanceDataReader ETF/{country} name metadata is empty"\n            )\n        symbol_column, name_column = self._listing_identity_columns(listing)\n        names: dict[str, str] = {}\n        for symbol, name in zip(listing[symbol_column], listing[name_column]):\n            if pd.isna(symbol) or pd.isna(name):\n                continue\n            key = str(symbol).strip().upper()\n            value = str(name).strip()\n            if key and value:\n                names[key] = value\n        self._etf_name_maps[country] = names\n        return names\n\n    def load_asset_names(self, assets: Iterable[AssetSpec]) -> dict[str, str]:\n        """Resolve ETF names from FDR listing metadata for config-time snapshots."""\n        import FinanceDataReader as fdr\n\n        country_by_currency = {"USD": "US", "KRW": "KR"}\n        resolved: dict[str, str] = {}\n        for asset in assets:\n            country = country_by_currency.get(asset.currency.upper())\n            if country is None:\n                continue\n            _, code = self._split_source(asset.symbol)\n            name = self._load_etf_name_map(fdr, country).get(code)\n            if name:\n                resolved[asset.symbol] = name\n        return resolved\n\n'''
          if anchor not in text:
              raise SystemExit('FDRLoader split_source anchor not found')
          text = text.replace(anchor, addition, 1)
          p.write_text(text, encoding='utf-8')

          p = Path('tests/test_asset_display_order_contract.py')
          text = p.read_text(encoding='utf-8')
          start = text.index('EXPECTED = [')
          end = text.index('\n\n\ndef result_fixture')
          replacement = '''EXPECTED = [\n    "QQQ",\n    "SPY",\n    "GLD",\n    "TLT",\n    "AIA",\n    "SLV",\n    "XLE",\n    "INDY",\n    "EWJ",\n    "EWY",\n    "XLF",\n    "GDX",\n]\nNAMES = {\n    "SPY": "State Street SPDR S&P 500 ETF Trust",\n    "GLD": "SPDR Gold Shares",\n    "TLT": "iShares 20+ Year Treasury Bond ETF",\n    "QQQ": "Invesco QQQ Trust  Series 1",\n    "SLV": "iShares Silver Trust",\n    "GDX": "VanEck Gold Miners ETF",\n    "AIA": "iShares Asia 50 ETF",\n    "XLF": "State Street Financial Sel Sec SPDR ETF",\n    "XLE": "State Street Energy Select Sector SPDR ETF",\n    "EWY": "Ishares Msci South Korea ETF",\n    "EWJ": "iShares MSCI Japan ETF",\n    "INDY": "iShares India 50 ETF",\n}'''
          text = text[:start] + replacement + text[end:]
          p.write_text(text, encoding='utf-8')

          p = Path('openspec/changes/bt-module/specs/research-input/spec.md')
          text = p.read_text(encoding='utf-8')
          block = '''\n\n### Requirement: Source-backed asset names in canonical input\nResearch Frontend가 asset 또는 benchmark의 `name`을 canonical YAML에 기록할 때는 v1 market-data provider가 제공한 종목명을 초기 설정 시점의 snapshot으로 사용해야 한다(MUST). 이 `name` field는 Optimization과 Backtest가 공유하며 run 실행마다 provider에서 다시 해석하지 않는다(MUST NOT).\n\n#### Scenario: ETF ticker로 canonical input 생성\n- GIVEN 사용자가 ETF ticker와 portfolio 조건을 확정했다\n- WHEN canonical YAML을 최초 생성한다\n- THEN FDR ETF listing metadata의 해당 종목명을 `name`에 기록하고 이후 Optimization/Backtest와 report가 동일한 persisted name을 사용한다\n'''
          if '### Requirement: Source-backed asset names in canonical input' not in text:
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')

          p = Path('openspec/changes/bt-module/design.md')
          text = p.read_text(encoding='utf-8')
          block = '''\n\n## Asset name snapshot impact\n\n- changed shared capability: market-data / research-input metadata handoff\n- reason: replace manually authored instrument names with FDR provider names while retaining the shared `AssetSpec.name` contract\n- affected products: portfolio-optimization, portfolio-backtest\n- affected regression: FDR metadata resolution, shared config hydration, report-level asset ordering/name rendering\n'''
          if '## Asset name snapshot impact' not in text:
              p.write_text(text.rstrip() + block + '\n', encoding='utf-8')
          PY

          cat > src/portfolio_optimizer_kr/config/names.py <<'PY'
          from __future__ import annotations

          from copy import deepcopy
          from typing import Any, Mapping

          from portfolio_optimizer_kr.models import AssetSpec

          from .yaml import ConfigValidationError


          def hydrate_asset_names(config: Mapping[str, Any], loader) -> dict[str, Any]:
              """Return a config copy whose asset/benchmark names come from provider metadata."""
              out = deepcopy(dict(config))
              asset_rows = out.get("assets")
              if not isinstance(asset_rows, list) or not asset_rows:
                  raise ConfigValidationError("assets must be a non-empty list")

              specs: dict[str, AssetSpec] = {}
              for index, raw in enumerate(asset_rows):
                  if not isinstance(raw, dict):
                      raise ConfigValidationError(f"assets[{index}] must be a mapping")
                  symbol = str(raw.get("symbol") or "").strip()
                  if not symbol:
                      raise ConfigValidationError(f"assets[{index}].symbol is required")
                  currency = str(raw.get("currency") or "KRW").upper()
                  specs.setdefault(symbol, AssetSpec(symbol=symbol, currency=currency))

              benchmark = out.get("benchmark")
              if isinstance(benchmark, dict):
                  symbol = str(benchmark.get("symbol") or "").strip()
                  if symbol and symbol not in specs:
                      currency = str(benchmark.get("currency") or "KRW").upper()
                      specs[symbol] = AssetSpec(symbol=symbol, currency=currency)
              elif isinstance(benchmark, str) and benchmark.strip():
                  symbol = benchmark.strip()
                  matched = next(
                      (
                          row
                          for row in asset_rows
                          if str(row.get("symbol") or "").strip() == symbol
                      ),
                      None,
                  )
                  if matched is None:
                      raise ConfigValidationError(
                          "string benchmark must match an asset or use mapping form with currency for name hydration"
                      )
                  benchmark = {
                      "symbol": symbol,
                      "currency": str(matched.get("currency") or "KRW").upper(),
                  }
                  out["benchmark"] = benchmark

              resolved = loader.load_asset_names(specs.values())
              missing = [symbol for symbol in specs if not resolved.get(symbol)]
              if missing:
                  raise ConfigValidationError(
                      "FDR ETF name metadata unavailable for: " + ", ".join(missing)
                  )

              for row in asset_rows:
                  symbol = str(row.get("symbol") or "").strip()
                  row["name"] = resolved[symbol]

              benchmark = out.get("benchmark")
              if isinstance(benchmark, dict):
                  symbol = str(benchmark.get("symbol") or "").strip()
                  if symbol:
                      benchmark["name"] = resolved[symbol]
              return out
          PY

          cat > src/portfolio_optimizer_kr/config/__init__.py <<'PY'
          from .names import hydrate_asset_names
          from .yaml import (
              ConfigValidationError,
              RunConfig,
              load_run_config,
              request_from_config,
              write_user_config,
          )

          __all__ = [
              "ConfigValidationError",
              "RunConfig",
              "hydrate_asset_names",
              "load_run_config",
              "request_from_config",
              "write_user_config",
          ]
          PY

          cat > scripts/hydrate_asset_names.py <<'PY'
          from __future__ import annotations

          import argparse
          from pathlib import Path

          import yaml

          from portfolio_optimizer_kr.config import hydrate_asset_names
          from portfolio_optimizer_kr.data import FDRLoader


          def main() -> int:
              parser = argparse.ArgumentParser(
                  description="Snapshot FDR ETF names into an existing Optimization/Backtest YAML."
              )
              parser.add_argument("config")
              args = parser.parse_args()

              path = Path(args.config)
              loaded = yaml.safe_load(path.read_text(encoding="utf-8"))
              hydrated = hydrate_asset_names(loaded, FDRLoader())
              path.write_text(
                  yaml.safe_dump(hydrated, sort_keys=False, allow_unicode=True),
                  encoding="utf-8",
              )
              for asset in hydrated.get("assets", []):
                  print(f"{asset['symbol']}\t{asset['name']}")
              benchmark = hydrated.get("benchmark")
              if isinstance(benchmark, dict) and benchmark.get("symbol"):
                  print(f"benchmark:{benchmark['symbol']}\t{benchmark.get('name', '')}")
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > tests/test_asset_name_snapshot.py <<'PY'
          from __future__ import annotations

          import sys
          from types import SimpleNamespace

          import pandas as pd

          from portfolio_optimizer_kr.config import hydrate_asset_names
          from portfolio_optimizer_kr.data import FDRLoader
          from portfolio_optimizer_kr.models import AssetSpec


          def test_fdr_loader_uses_provider_etf_names_without_semantic_rewriting(monkeypatch):
              calls = []

              def stock_listing(kind):
                  calls.append(kind)
                  if kind == "ETF/US":
                      return pd.DataFrame(
                          {
                              "Symbol": ["SPY", "QQQ"],
                              "Name": [
                                  "State Street SPDR S&P 500 ETF Trust",
                                  "Invesco QQQ Trust  Series 1",
                              ],
                          }
                      )
                  if kind == "ETF/KR":
                      return pd.DataFrame(
                          {"Code": ["069500"], "Name": ["KODEX 200"]}
                      )
                  raise AssertionError(kind)

              monkeypatch.setitem(
                  sys.modules,
                  "FinanceDataReader",
                  SimpleNamespace(StockListing=stock_listing),
              )
              loader = FDRLoader()
              resolved = loader.load_asset_names(
                  [
                      AssetSpec("SPY", name="manual", currency="USD"),
                      AssetSpec("QQQ", name="manual", currency="USD"),
                      AssetSpec("NAVER:069500", name="manual", currency="KRW"),
                  ]
              )
              assert resolved == {
                  "SPY": "State Street SPDR S&P 500 ETF Trust",
                  "QQQ": "Invesco QQQ Trust  Series 1",
                  "NAVER:069500": "KODEX 200",
              }
              assert calls == ["ETF/US", "ETF/KR"]


          def test_hydrate_asset_names_overwrites_manual_names_and_snapshots_benchmark():
              class Loader:
                  def load_asset_names(self, assets):
                      return {
                          "SPY": "State Street SPDR S&P 500 ETF Trust",
                          "GLD": "SPDR Gold Shares",
                      }

              original = {
                  "product_mode": "backtest",
                  "run_id": "demo",
                  "assets": [
                      {"symbol": "SPY", "name": "S&P 500", "currency": "USD"},
                      {"symbol": "GLD", "name": "Gold", "currency": "USD"},
                  ],
                  "benchmark": {
                      "symbol": "SPY",
                      "name": "Benchmark",
                      "currency": "USD",
                  },
              }
              hydrated = hydrate_asset_names(original, Loader())
              assert hydrated["assets"][0]["name"] == "State Street SPDR S&P 500 ETF Trust"
              assert hydrated["assets"][1]["name"] == "SPDR Gold Shares"
              assert hydrated["benchmark"]["name"] == "State Street SPDR S&P 500 ETF Trust"
              assert original["assets"][0]["name"] == "S&P 500"
          PY

      - name: Run full regression before live metadata call
        run: pytest -q
      - name: Prepare v7 canonical config with FDR names
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p = Path('configs/backtest-pv-reference-parity.yaml')
          cfg = yaml.safe_load(p.read_text(encoding='utf-8'))
          cfg['run_id'] = '20260903-backtest-pv-reference-parity-yty-v7'
          p.write_text(yaml.safe_dump(cfg, sort_keys=False, allow_unicode=True), encoding='utf-8')
          PY
          python scripts/hydrate_asset_names.py configs/backtest-pv-reference-parity.yaml
      - name: Generate v7 report
        run: python -m portfolio_optimizer_kr.cli run configs/backtest-pv-reference-parity.yaml --output-root runs
      - name: Verify source names and report output
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          cfg = yaml.safe_load(Path('configs/backtest-pv-reference-parity.yaml').read_text(encoding='utf-8'))
          names = {row['symbol']: row['name'] for row in cfg['assets']}
          assert names['SPY'] == 'State Street SPDR S&P 500 ETF Trust'
          assert names['QQQ'] == 'Invesco QQQ Trust  Series 1'
          assert names['XLF'] == 'State Street Financial Sel Sec SPDR ETF'
          assert names['XLE'] == 'State Street Energy Select Sector SPDR ETF'
          assert names['EWY'] == 'Ishares Msci South Korea ETF'
          assert cfg['benchmark']['name'] == names['SPY']
          report = Path('runs/20260903-backtest-pv-reference-parity-yty-v7/report.html').read_text(encoding='utf-8')
          for required in [names['SPY'], names['XLF'], names['XLE'], names['EWY']]:
              assert required in report
          assert 'Financial Select Sector SPDR Fund' not in report
          assert 'Energy Select Sector SPDR Fund' not in report
          PY
          cat > runs/20260903-backtest-pv-reference-parity-yty-v7/README.md <<'MD'
          # Backtest PV parity Year-to-Year v7

          v7 preserves the v6 financial/report contract and changes instrument naming provenance only.

          - `AssetSpec.name` remains part of the shared Optimization/Backtest input contract.
          - asset and benchmark names in the canonical YAML are snapshots from FinanceDataReader `StockListing("ETF/US")` metadata.
          - report labels use the persisted source-backed names; runtime finance calculations are unchanged.
          - equal-weight asset display ordering may move where the existing deterministic tie-break uses asset name.
          MD
      - name: Run regression after v7 generation
        run: pytest -q
      - name: Commit implementation and v7 run
        run: |
          git config user.name 'JY'
          git config user.email '82421088+comus93@users.noreply.github.com'
          git rm .github/workflows/apply-fdr-asset-name-snapshot-once.yml
          git add src scripts tests configs openspec runs/20260903-backtest-pv-reference-parity-yty-v7
          git commit -m 'market-data: snapshot FDR asset names into configs'
          git push origin bt-module
