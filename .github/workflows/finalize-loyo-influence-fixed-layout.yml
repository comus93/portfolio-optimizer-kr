name: Finalize LOYO influence fixed layout

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-loyo-influence-fixed-layout.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Apply fixed-width Asset-Year Influence layout
        run: python scripts/finalize_loyo_influence_fixed_layout.py

      - name: Regenerate persisted run report without reoptimization
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from portfolio_optimizer_kr.viewer import generate_report
          generate_report(Path("runs/20260914-0003"))
          PY

      - name: Run targeted regressions
        run: >-
          uv run pytest -q
          tests/test_loyo_asset_year_influence.py
          tests/test_loyo_robustness.py
          tests/test_loyo_report_correlation_scope.py

      - name: Validate fixed layout contract
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          overlay = Path("src/portfolio_optimizer_kr/viewer/loyo_overlay.py").read_text(encoding="utf-8")
          report = Path("runs/20260914-0003/report.html").read_text(encoding="utf-8")

          required = (
              "table.loyo-influence { width: 100%; min-width: 0; table-layout: fixed; }",
              ".loyo-influence thead th:first-child { width: 56px; }",
              ".loyo-influence thead th:nth-child(2) { width: 176px; }",
              ".loyo-influence .loyo-metric { white-space: nowrap; }",
              ".loyo-influence .loyo-asset-name { max-width: 100%; }",
          )
          for marker in required:
              assert marker in overlay, marker
              assert marker in report, marker

          assert "table.loyo-matrix { width: max-content; min-width: 100%;" in overlay
          assert "loyo-year-band-alt" in report
          assert "loyo-asset-name" in report
          assert "loyo-asset-ticker" in report
          PY

      - name: Archive OpenSpec change and remove temporary tooling
        run: |
          mkdir -p openspec/changes/archive
          git mv \
            openspec/changes/2026-09-16-loyo-influence-fixed-layout \
            openspec/changes/archive/2026-09-16-loyo-influence-fixed-layout
          git rm \
            scripts/finalize_loyo_influence_fixed_layout.py \
            .github/workflows/finalize-loyo-influence-fixed-layout.yml

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/portfolio_optimizer_kr/viewer/loyo_overlay.py \
            docs/report-ui-specification.md \
            openspec/specs/research-report/spec.md \
            openspec/changes/archive/2026-09-16-loyo-influence-fixed-layout \
            ai-share/llm-to-llm.md \
            runs/20260914-0003/report.html
          git commit -m "fix: fit Asset-Year Influence to report width"
          git push origin HEAD:main
