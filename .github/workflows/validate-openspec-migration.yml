name: Validate OpenSpec migration

on:
  push:
    branches: [bt-module]
    paths:
      - '.github/workflows/validate-openspec-migration.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@latest
      - name: Strict validate OpenSpec
        run: openspec validate --all --strict --no-interactive
      - name: Mark strict validation complete
        shell: python
        run: |
          from pathlib import Path
          p = Path('openspec/changes/bt-module/tasks.md')
          text = p.read_text(encoding='utf-8')
          old = '- [ ] OpenSpec strict validation 수행'
          if old in text:
              p.write_text(text.replace(old, '- [x] OpenSpec strict validation 수행', 1), encoding='utf-8')
      - name: Commit validation task state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec/changes/bt-module/tasks.md
          if git diff --cached --quiet; then
            echo "No task update"
          else
            git commit -m "spec: record strict OpenSpec validation"
            git push origin HEAD:bt-module
          fi
