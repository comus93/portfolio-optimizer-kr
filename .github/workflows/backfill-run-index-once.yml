name: Backfill run index once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/backfill-run-index-once.yml"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Build aggregate run index
        run: python scripts/rebuild_run_navigation.py

      - name: Commit aggregate catalog
        run: |
          if [ -z "$(git status --porcelain -- runs/README.md)" ]; then
            echo "runs/README.md already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runs/README.md
          git commit -m "docs: backfill run catalog"
          git push origin HEAD:main
