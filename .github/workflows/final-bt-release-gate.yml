name: Archive completed bt-module OpenSpec change

on:
  push:
    branches: [release-gate-work]
    paths:
      - '.github/workflows/final-bt-release-gate.yml'

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@latest
      - name: Verify change is complete before archive
        shell: python
        run: |
          import json, subprocess
          data = json.loads(subprocess.check_output([
              'openspec','status','--change','bt-module','--json'
          ], text=True))
          assert data['isPlanningComplete'] is True, data
          assert data['isComplete'] is True, data
          assert all(a['status'] == 'done' for a in data['artifacts']), data['artifacts']
      - name: Archive change without altering synced baseline
        run: |
          set -euo pipefail
          test -d openspec/changes/bt-module
          test ! -e openspec/changes/archive/2026-09-04-bt-module
          git mv openspec/changes/bt-module openspec/changes/archive/2026-09-04-bt-module
          openspec validate --specs --strict --no-interactive
          openspec validate --all --strict --no-interactive
          git diff --check
      - name: Commit archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openspec/changes openspec/specs
          git diff --cached --stat
          git commit -m "openspec: archive completed bt-module change"
          git push origin HEAD:bt-module
