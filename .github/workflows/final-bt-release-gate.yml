name: Inspect bt-module OpenSpec archive inputs

on:
  push:
    branches: [release-gate-work]
    paths:
      - '.github/workflows/final-bt-release-gate.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@latest
      - name: Capture archive inputs
        run: |
          openspec status --change bt-module --json > /tmp/status.json
          openspec instructions archive --change bt-module --json > /tmp/archive-instructions.json || true
          openspec instructions specs --change bt-module --json > /tmp/specs-instructions.json
          openspec validate --all --strict --no-interactive
      - uses: actions/upload-artifact@v4
        with:
          name: bt-module-openspec-archive-inputs
          path: |
            /tmp/status.json
            /tmp/archive-instructions.json
            /tmp/specs-instructions.json
