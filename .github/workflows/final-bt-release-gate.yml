name: Validate promoted main

on:
  push:
    branches: [release-gate-work]
    paths:
      - '.github/workflows/final-bt-release-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project and OpenSpec
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          npm install -g @fission-ai/openspec@latest
      - name: Full Python regression
        run: python -m pytest -q
      - name: Strict OpenSpec validation
        run: |
          openspec validate --specs --strict --no-interactive
          openspec validate --all --strict --no-interactive
      - name: Main control is idle
        run: |
          grep -Eq '^[[:space:]]*run:[[:space:]]*false([[:space:]]*#.*)?[[:space:]]*$' control/execute.yaml
      - name: Verify promoted commit
        run: |
          test "$(git rev-parse HEAD)" = "fe63f32986c7130a66d9e7d331b45f63d07f2474"
