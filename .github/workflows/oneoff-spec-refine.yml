name: One-off specification refinement

on:
  push:
    paths:
      - '.github/workflows/oneoff-spec-refine.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine specification wording and solver routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('specification.md')
          s = p.read_text(encoding='utf-8')

          replacements = {
              '`portfolio-optimizer-kr`는 **Portfolio Visualizer가 직접 지원하지 않는 국내 상장 ETF도 동일한 mean-variance optimization framework에서 분석할 수 있게 만드는 것**을 1차 목표로 한다.':
              '`portfolio-optimizer-kr`는 **Portfolio Visualizer가 직접 지원하지 않는 국내 투자 자산도 동일한 mean-variance optimization framework에서 분석할 수 있게 만드는 것**을 1차 목표로 한다. 개별 종목, ETF, ETN 등 FDR에서 가격 시계열을 확보할 수 있는 국내 상장 투자 자산을 대상으로 할 수 있다.',

              '해외 ETF도 동일 framework에서 다룰 수 있으며, KRW 기준 통화 정규화를 통해 서로 다른 국가의 자산을 하나의 portfolio에서 통합 optimization하는 기능도 지원한다. 다만 cross-country optimization은 핵심 목적이라기보다 국내 ETF까지 optimizer universe를 확장한 결과로 제공되는 feature다.':
              '해외 투자 자산도 동일 framework에서 다룰 수 있으며, KRW 기준 통화 정규화를 통해 서로 다른 국가의 자산을 하나의 portfolio에서 통합 optimization하는 기능도 지원한다. 다만 cross-country optimization은 핵심 목적이라기보다 국내 투자 자산까지 optimizer universe를 확장한 결과로 제공되는 feature다.',

              'FDR을 통해 한국 ETF/주식과 지원되는 미국 ticker를 조회한다.':
              'FDR을 통해 주식, ETF, ETN 등 지원되는 국내 투자 자산과 지원되는 해외 ticker를 조회한다.',

              'Numerical Solver = CLARABEL':
              'QP Solver = OSQP\nSOCP Solver = CLARABEL',

              '기본 numerical solver는 **CLARABEL**로 고정한다.\n\n선정 이유:\n\n- Efficient Frontier의 minimum-variance 문제는 convex QP다.\n- Target Volatility 문제는 second-order cone constraint를 포함할 수 있다.\n- CLARABEL은 QP와 SOCP를 모두 처리할 수 있어 v1 objective를 하나의 solver로 일관되게 처리할 수 있다.\n- CVXPY의 문제 표현을 사용하면 objective와 constraints가 코드에서 명시적으로 드러난다.':
              '문제 유형에 따라 CVXPY의 표준 specialized solver routing을 명시적으로 사용한다.\n\n```text\nQP   -> OSQP\nSOCP -> CLARABEL\n```\n\n선정 이유:\n\n- Efficient Frontier와 convex transformation 이후의 Maximum Sharpe 문제는 QP로 다룰 수 있으며 OSQP가 해당 문제 유형에 특화되어 있다.\n- Target Volatility 문제는 second-order cone constraint를 포함하므로 CLARABEL을 사용한다.\n- CVXPY 자체도 QP에는 OSQP, SOCP에는 CLARABEL을 기본 선택하며 두 solver 모두 CVXPY 기본 dependency다.\n- CVXPY의 문제 표현을 사용하면 objective와 constraints가 코드에서 명시적으로 드러난다.\n- solver를 문제 유형에 맞게 분리하되 결과 검증 규칙은 공통으로 유지한다.'
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'expected text not found: {old[:80]}')
              s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add specification.md
          git commit -m "Refine project scope and solver routing"
          git push
