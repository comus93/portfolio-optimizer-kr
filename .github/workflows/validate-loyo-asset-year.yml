name: Validate LOYO asset-year influence

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-loyo-asset-year.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Targeted LOYO tests
        run: >-
          uv run pytest -q
          tests/test_loyo_asset_year_influence.py
          tests/test_loyo_robustness.py
          tests/test_loyo_report_correlation_scope.py
