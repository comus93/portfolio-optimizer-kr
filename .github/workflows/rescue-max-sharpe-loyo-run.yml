name: Rescue max Sharpe LOYO research run

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rescue-max-sharpe-loyo-run.yml"

permissions:
  contents: write
  actions: write
  pages: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --frozen

      - name: Execute max Sharpe experiment with LOYO
        id: execute
        shell: bash
        run: |
          set -euo pipefail
          portfolio-optimizer execute \
            --repo-root . \
            --control control/execute.yaml \
            --output-root runs | tee /tmp/portfolio-run.log
          RUN_PATH="$(tail -n 1 /tmp/portfolio-run.log | tr -d '\r')"
          test -d "$RUN_PATH"
          RUN_ID="$(basename "$RUN_PATH")"
          echo "run_path=$RUN_PATH" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          test -f "$RUN_PATH/result.json"
          test -f "$RUN_PATH/report.html"
          test -f "$RUN_PATH/review/loyo_robustness.csv"
          test -f "$RUN_PATH/review/asset_year_influence.csv"

      - name: Register public report URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          PAGE_BASE_URL="$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.html_url')"
          REPORT_RELATIVE_PATH="$RUN_PATH/report.html"
          PUBLIC_REPORT_URL="${PAGE_BASE_URL%/}/${REPORT_RELATIVE_PATH}"
          python scripts/register_public_report_url.py "$RUN_PATH" "$PUBLIC_REPORT_URL"
          echo "PUBLIC_REPORT_URL=$PUBLIC_REPORT_URL" >> "$GITHUB_ENV"

      - name: Commit run and consume request
        shell: bash
        run: |
          set -euo pipefail
          RUN_PATH="${{ steps.execute.outputs.run_path }}"
          RUN_ID="${{ steps.execute.outputs.run_id }}"
          python - <<'PY'
          from pathlib import Path
          import yaml
          path = Path('control/execute.yaml')
          payload = yaml.safe_load(path.read_text(encoding='utf-8')) or {}
          payload['run'] = False
          path.write_text(yaml.safe_dump(payload, sort_keys=False, allow_unicode=True), encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rescue-max-sharpe-loyo-run.yml
          git add "$RUN_PATH" runs/README.md control/execute.yaml
          git commit -m "runs: add $RUN_ID max Sharpe LOYO"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Publish reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish-reports.yml --ref main

      - name: Summary
        run: |
          echo "## Max Sharpe LOYO run" >> "$GITHUB_STEP_SUMMARY"
          echo "- Run ID: \`${{ steps.execute.outputs.run_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Report: $PUBLIC_REPORT_URL" >> "$GITHUB_STEP_SUMMARY"
