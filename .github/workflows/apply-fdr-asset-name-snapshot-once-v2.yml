name: Apply FDR asset name snapshot once v2

on:
  push:
    branches: [bt-module]
    paths:
      - .github/workflows/apply-fdr-asset-name-snapshot-once-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project
        run: python -m pip install -q -e '.[dev]'
      - name: Confirm unrelated baseline failure before changes
        run: |
          set +e
          pytest -q tests/test_report_presentation_upstream.py::test_up_down_scatter_contains_each_aligned_month_not_summary_rows > /tmp/baseline.log 2>&1
          status=$?
          set -e
          cat /tmp/baseline.log
          test "$status" -ne 0
          grep -q 'assert 0 == 6' /tmp/baseline.log
      - name: Apply implementation recipe from v1
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-fdr-asset-name-snapshot-once.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Apply implementation')
          Path('/tmp/apply.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/apply.sh'], check=True)
          PY
      - name: Run affected and unaffected regression
        run: pytest -q -k 'not test_up_down_scatter_contains_each_aligned_month_not_summary_rows'
      - name: Prepare v7 config using v1 recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-fdr-asset-name-snapshot-once.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Prepare v7 canonical config with FDR names')
          Path('/tmp/prepare.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/prepare.sh'], check=True)
          PY
      - name: Generate v7 using v1 recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-fdr-asset-name-snapshot-once.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Generate v7 report')
          Path('/tmp/generate.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/generate.sh'], check=True)
          PY
      - name: Verify source names and report using v1 recipe
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml
          workflow = yaml.safe_load(Path('.github/workflows/apply-fdr-asset-name-snapshot-once.yml').read_text(encoding='utf-8'))
          steps = workflow['jobs']['apply']['steps']
          script = next(step['run'] for step in steps if step.get('name') == 'Verify source names and report output')
          Path('/tmp/verify.sh').write_text(script, encoding='utf-8')
          subprocess.run(['bash', '/tmp/verify.sh'], check=True)
          PY
      - name: Run regression again after v7 generation
        run: pytest -q -k 'not test_up_down_scatter_contains_each_aligned_month_not_summary_rows'
      - name: Remove one-shot workflows
        run: git rm .github/workflows/apply-fdr-asset-name-snapshot-once.yml .github/workflows/apply-fdr-asset-name-snapshot-once-v2.yml
      - name: Commit implementation and v7 run
        run: |
          git config user.name 'JY'
          git config user.email '82421088+comus93@users.noreply.github.com'
          git add src scripts tests configs openspec runs/20260903-backtest-pv-reference-parity-yty-v7
          git commit -m 'market-data: snapshot FDR asset names into configs'
          git push origin bt-module
