name: Apply backtest report feedback v2

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/apply-report-feedback-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reuse source patch from first workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          text = Path('.github/workflows/apply-report-feedback.yml').read_text(encoding='utf-8')
          start = '      - name: Apply report feedback\n        shell: bash\n        run: |\n'
          end = '\n      - name: Install project and test dependencies\n'
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('source patch workflow structure changed')
          block = text.split(start, 1)[1].split(end, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          )
          subprocess.run(['bash', '-e', '-o', 'pipefail', '-c', script], check=True)

          # SPY is both the benchmark ticker and a constituent in the real run.
          # The asset identity must stay while only the synthetic benchmark/portfolio dimensions disappear.
          p = Path('tests/test_backtest_report_content_contract.py')
          body = p.read_text(encoding='utf-8')
          old = '    assert html.escape(BENCHMARK) not in rendered\n'
          new = (
              '    assert "<th>benchmark</th>" not in rendered\n'
              '    assert "<th>Growth 70/30</th>" not in rendered\n'
              '    assert "SPDR S&amp;P 500 ETF Trust" in rendered\n'
          )
          if body.count(old) != 1:
              raise SystemExit('benchmark constituent assertion anchor changed')
          p.write_text(body.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused report regression
        run: |
          python -m pytest -q \
            tests/test_backtest_execution.py \
            tests/test_backtest_report_content_contract.py \
            tests/test_backtest_report_presentation.py \
            tests/test_backtest_shared_end_to_end.py

      - name: Commit source and tests only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: refine backtest asset identity and correlations"
          git push origin HEAD:bt-module
