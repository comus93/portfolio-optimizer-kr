name: Finalize LOYO readability refinement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-loyo-readability.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --extra dev

      - name: Apply specification and static layout refinements
        run: python scripts/finalize_loyo_readability.py

      - name: Regenerate persisted run report without reoptimization
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from portfolio_optimizer_kr.viewer import generate_report
          generate_report(Path("runs/20260914-0003"))
          PY

      - name: Run targeted regressions
        run: >-
          uv run pytest -q
          tests/test_loyo_asset_year_influence.py
          tests/test_loyo_robustness.py
          tests/test_loyo_report_correlation_scope.py

      - name: Validate LOYO source contract
        run: |
          uv run python - <<'PY'
          from pathlib import Path

          report = Path("runs/20260914-0003/report.html").read_text(encoding="utf-8")
          metrics = report.index('id="portfolio-metrics"')
          loyo = report.index('id="loyo-robustness"')
          monthly = report.index('id="monthly-returns"')
          assert metrics < loyo < monthly

          for marker in (
              'loyo-year-band-alt',
              'loyo-asset-name',
              'loyo-asset-ticker',
              'loyo-asset-legend',
              'KODEX 은선물(H)',
              'KODEX 콩선물(H)',
              '144600',
              '138920',
          ):
              assert marker in report, marker

          overlay = Path("src/portfolio_optimizer_kr/viewer/loyo_overlay.py").read_text(encoding="utf-8")
          assert "mousemove" not in overlay
          assert "mouseenter" not in overlay
          PY

      - name: Archive OpenSpec change and remove temporary tooling
        run: |
          mkdir -p openspec/changes/archive
          git mv \
            openspec/changes/2026-09-16-loyo-readability-layout \
            openspec/changes/archive/2026-09-16-loyo-readability-layout
          git rm \
            scripts/finalize_loyo_readability.py \
            .github/workflows/finalize-loyo-readability.yml

      - name: Commit final result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/report-ui-specification.md \
            openspec/specs/research-report/spec.md \
            openspec/changes/archive/2026-09-16-loyo-readability-layout \
            ai-share/llm-to-llm.md \
            runs/20260914-0003/report.html
          git add -f site/report-template.html
          git commit -m "feat: improve LOYO report readability"
          git push origin HEAD:main
