name: Validate pinned research RF default

on:
  push:
    branches: [rf-default-pinned-us3m]
    paths:
      - "src/portfolio_optimizer_kr/research.py"
      - "tests/test_research_risk_free_default.py"
      - "tests/test_research.py"
      - "tests/test_backtest_execution.py"
      - "tests/test_runner.py"
      - ".github/workflows/validate-rf-default-temp.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile affected runtime
        run: python -m compileall -q src/portfolio_optimizer_kr

      - name: Run targeted regression
        run: |
          python -m pytest -q \
            tests/test_research_risk_free_default.py \
            tests/test_research.py \
            tests/test_backtest_execution.py \
            tests/test_runner.py
