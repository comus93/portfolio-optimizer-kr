name: Temporary active contribution legend order fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-active-contribution-legend-order.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Apply scoped changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/portfolio_optimizer_kr/viewer/historical_active_components.py')
          text = path.read_text(encoding='utf-8')
          old = '''    return hc.chart_shell(\n        chart_id,\n        svg,\n        hc.legend((label, (color_map or {}).get(column, hc.PALETTE[index % len(hc.PALETTE)])) for index, (column, label) in enumerate(series)),\n    )\n'''
          new = '''    # The stacked chart renders positive values from zero upward and negative\n    # values from zero downward. Order the legend to match the visible stack\n    # at the right edge (latest observation), top to bottom.\n    latest = shaped.iloc[-1]\n    positive = [\n        item\n        for item in series\n        if hc.finite(latest.get(item[0])) and float(latest[item[0]]) > 0\n    ]\n    negative = [\n        item\n        for item in series\n        if hc.finite(latest.get(item[0])) and float(latest[item[0]]) < 0\n    ]\n    neutral = [\n        item\n        for item in series\n        if not hc.finite(latest.get(item[0])) or float(latest[item[0]]) == 0\n    ]\n    legend_series = [*reversed(positive), *negative, *neutral]\n    color_by_column = {\n        column: (color_map or {}).get(\n            column, hc.PALETTE[index % len(hc.PALETTE)]\n        )\n        for index, (column, _) in enumerate(series)\n    }\n    return hc.chart_shell(\n        chart_id,\n        svg,\n        hc.legend(\n            (label, color_by_column[column])\n            for column, label in legend_series\n        ),\n    )\n'''
          if old not in text:
              raise SystemExit('active contribution chart return block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_active_visual_reference_contract.py')
          text = test.read_text(encoding='utf-8')
          anchor = '''    assert '<polyline' not in rendered\n\n\n'''
          addition = '''    assert '<polyline' not in rendered\n\n\ndef test_active_contribution_legend_matches_latest_stack_top_to_bottom():\n    dates = pd.date_range("2025-01-31", periods=2, freq="ME")\n    rows = []\n    for date in dates:\n        rows.extend(\n            [\n                {\n                    "date": date,\n                    "portfolio": PORTFOLIO,\n                    "ticker": "QQQ",\n                    "cumulative_active_contribution_pct": 2.0,\n                },\n                {\n                    "date": date,\n                    "portfolio": PORTFOLIO,\n                    "ticker": "GLD",\n                    "cumulative_active_contribution_pct": -1.0,\n                },\n                {\n                    "date": date,\n                    "portfolio": PORTFOLIO,\n                    "ticker": "AIA",\n                    "cumulative_active_contribution_pct": 3.0,\n                },\n            ]\n        )\n    rendered = active.active_contribution(\n        pd.DataFrame(rows),\n        [PORTFOLIO],\n        {\n            "QQQ": "Invesco QQQ Trust",\n            "GLD": "SPDR Gold Shares",\n            "AIA": "iShares Asia 50 ETF",\n        },\n    )\n\n    # Positive stack is QQQ then AIA from zero upward, so visually the latest\n    # bar is AIA above QQQ, followed by GLD below zero. Legend follows that.\n    aia = rendered.index("iShares Asia 50 ETF")\n    qqq = rendered.index("Invesco QQQ Trust")\n    gld = rendered.index("SPDR Gold Shares")\n    assert aia < qqq < gld\n\n\n'''
          if anchor not in text:
              raise SystemExit('test anchor not found')
          test.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          base = Path('openspec/changes/2026-09-14-active-contribution-legend-order')
          (base / 'specs/research-report').mkdir(parents=True, exist_ok=True)
          (base / 'proposal.md').write_text('''# Change: Align Cumulative Active Return legend with rendered stack\n\n## Why\nThe Cumulative Active Return chart uses positive and negative stacked contributions, while the legend followed asset input order. This can make the legend order disagree with the visible stack and cause users to misidentify contribution segments.\n\n## What changes\n- Keep contribution calculations unchanged.\n- Order the legend by the latest rendered stack from top to bottom.\n- Preserve each asset's existing color identity.\n''', encoding='utf-8')
          (base / 'design.md').write_text('''# Design\n\nThe chart continues to stack positive values from zero upward and negative values from zero downward. At the latest observation, the visible top-to-bottom order is: positive series in reverse stack insertion order, then negative series in stack insertion order, then zero/unavailable series. The legend uses that order while retaining the original asset-to-color mapping.\n''', encoding='utf-8')
          (base / 'tasks.md').write_text('''# Tasks\n\n- [x] Align Cumulative Active Return legend with the latest visible stack order.\n- [x] Preserve existing asset colors.\n- [x] Add regression coverage.\n''', encoding='utf-8')
          (base / 'specs/research-report/spec.md').write_text('''## ADDED Requirements\n\n### Requirement: Cumulative Active Return legend follows rendered stack\nThe Cumulative Active Return legend MUST preserve asset color identity and SHOULD follow the latest visible stacked-bar order from top to bottom so legend position does not contradict the graph.\n''', encoding='utf-8')
          PY
      - name: Sync dependencies
        run: uv sync --frozen --extra dev
      - name: Run targeted regression
        run: uv run pytest -q tests/test_active_visual_reference_contract.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/portfolio_optimizer_kr/viewer/historical_active_components.py tests/test_active_visual_reference_contract.py openspec/changes/2026-09-14-active-contribution-legend-order
          git commit -m "fix: align active contribution legend with stack"
          git push origin HEAD:main
