name: Validate frontier risk analytics

on:
  push:
    branches: [main]
    paths:
      - "src/portfolio_optimizer_kr/analytics/frontier_risk.py"
      - "src/portfolio_optimizer_kr/viewer/frontier_risk_dashboard.py"
      - "src/portfolio_optimizer_kr/viewer/shared_historical_overlay.py"
      - "scripts/analyze_frontier_risk_tradeoff.py"
      - "tests/test_frontier_risk.py"
      - "tests/test_frontier_risk_dashboard.py"
      - "tests/test_optimizer_shared_historical_mount.py"
      - ".github/workflows/run-optimization.yml"
      - ".github/workflows/validate-frontier-risk.yml"
      - "openspec/changes/2026-09-10-frontier-risk-tradeoff/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run frontier risk tests
        run: |
          python -m pytest -q \
            tests/test_frontier_risk.py \
            tests/test_frontier_risk_dashboard.py \
            tests/test_optimizer_shared_historical_mount.py
