name: Apply asset display order once v2

on:
  push:
    branches: [bt-module]
    paths:
      - .github/workflows/apply-asset-display-order-once-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch presentation components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          def sub_once(text: str, pattern: str, repl: str, label: str, flags: int = 0) -> str:
              rendered, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 regex match, got {count}")
              return rendered

          def patch_function(text: str, name: str, transform):
              start = text.index(f"def {name}(")
              next_def = text.find("\n\ndef ", start + 1)
              end = len(text) if next_def < 0 else next_def + 2
              block = text[start:end]
              rendered = transform(block)
              if rendered == block:
                  raise SystemExit(f"{name}: transform made no change")
              return text[:start] + rendered + text[end:]

          # backtest_renderer.py
          path = Path('src/portfolio_optimizer_kr/viewer/backtest_renderer.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from . import historical_active_components as active_components\n',
              'from . import asset_display as ad\nfrom . import historical_active_components as active_components\n',
              'backtest import',
          )

          def allocation_transform(block: str) -> str:
              old = (
                  '    requested = portfolio_order or _portfolio_order(shaped, [])\n'
                  '    columns = [name for name in requested if name in pivot.columns]\n'
                  '    columns.extend(column for column in pivot.columns if column not in columns)\n'
                  '    pivot = pivot.reindex(columns=columns).reset_index()\n'
              )
              new = (
                  '    requested = portfolio_order or _portfolio_order(shaped, [])\n'
                  '    columns = [name for name in requested if name in pivot.columns]\n'
                  '    columns.extend(column for column in pivot.columns if column not in columns)\n'
                  '    asset_order = ad.asset_display_order_from_allocations(shaped)\n'
                  '    labels = (\n'
                  '        shaped.assign(ticker=shaped["ticker"].astype(str))\n'
                  '        .drop_duplicates("ticker")\n'
                  '        .set_index("ticker")["asset"]\n'
                  '        .astype(str)\n'
                  '        .to_dict()\n'
                  '    )\n'
                  '    ordered_labels = [labels[ticker] for ticker in asset_order if ticker in labels]\n'
                  '    ordered_labels.extend(label for label in pivot.index if label not in ordered_labels)\n'
                  '    pivot = pivot.reindex(index=ordered_labels, columns=columns).reset_index()\n'
              )
              return replace_once(block, old, new, 'allocation order')

          text = patch_function(text, '_allocation_matrix', allocation_transform)
          text = sub_once(
              text,
              r'(    series_labels = \{"benchmark": benchmark_label or "Benchmark"\}\n)'
              r'    asset_names = \{\n.*?\n    \}\n',
              r'\1    base_asset_names = ad.asset_names_from_configuration(configuration)\n'
              r'    asset_order = ad.asset_display_order(result, base_asset_names)\n'
              r'    asset_names = ad.ordered_asset_names(base_asset_names, asset_order)\n',
              'backtest ordered names',
              re.S,
          )
          path.write_text(text, encoding='utf-8')

          # pv_visual.py
          path = Path('src/portfolio_optimizer_kr/viewer/pv_visual.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from . import historical_components as hc\n',
              'from . import asset_display as ad\nfrom . import historical_components as hc\n',
              'pv visual import',
          )

          def grouped_transform(block: str) -> str:
              block = replace_once(
                  block,
                  '    x_title: str = "Year",\n) -> str:\n',
                  '    x_title: str = "Year",\n    series_colors: list[str] | None = None,\n) -> str:\n',
                  'grouped signature',
              )
              block = replace_once(
                  block,
                  '    if not categories or not series or not values:\n        return \'<p class="muted">N/A</p>\'\n\n',
                  '    if not categories or not series or not values:\n        return \'<p class="muted">N/A</p>\'\n    colors = series_colors or hc.PALETTE\n\n',
                  'grouped colors init',
              )
              block = replace_once(
                  block,
                  '            color = hc.PALETTE[series_index % len(hc.PALETTE)]\n',
                  '            color = colors[series_index % len(colors)]\n',
                  'grouped mark color',
              )
              block = replace_once(
                  block,
                  '            (name, hc.PALETTE[index % len(hc.PALETTE)])\n',
                  '            (name, colors[index % len(colors)])\n',
                  'grouped legend color',
              )
              return block

          text = patch_function(text, 'grouped_bar_chart', grouped_transform)

          def annual_asset_transform(block: str) -> str:
              block = sub_once(
                  block,
                  r'    years = sorted\(int\(value\) for value in shaped\["year"\]\.dropna\(\)\.unique\(\)\)\n'
                  r'    tickers: list\[str\] = \[\]\n'
                  r'    for ticker in shaped\["ticker"\]\.astype\(str\):\n'
                  r'        if ticker not in tickers:\n'
                  r'            tickers\.append\(ticker\)\n\n'
                  r'    names = asset_names or \{\}\n',
                  '    years = sorted(int(value) for value in shaped["year"].dropna().unique())\n'
                  '    names = asset_names or {}\n'
                  '    available: list[str] = []\n'
                  '    for ticker in shaped["ticker"].astype(str):\n'
                  '        if ticker not in available:\n'
                  '            available.append(ticker)\n'
                  '    tickers = [ticker for ticker in names if ticker in available]\n'
                  '    tickers.extend(ticker for ticker in available if ticker not in tickers)\n'
                  '    color_map = ad.asset_color_map(tickers)\n',
                  'annual asset order',
              )
              block = replace_once(
                  block,
                  '        x_title="Year",\n    )\n',
                  '        x_title="Year",\n        series_colors=[color_map[ticker] for ticker in tickers],\n    )\n',
                  'annual asset colors',
              )
              return block

          text = patch_function(text, 'annual_asset_returns_chart', annual_asset_transform)

          def correlations_transform(block: str) -> str:
              old = (
                  '    return (\n'
                  '        \'<div class="table-wrap correlation-wrap">\'\n'
                  '        \'<table id="correlations-heatmap" \'\n'
                  '        \'class="heatmap monthly-correlations">\'\n'
                  '        f"<thead><tr><th>Ticker</th><th>Name</th>{header}</tr></thead>"\n'
                  '        f"<tbody>{\'\'.join(rows)}</tbody></table></div>"\n'
                  '    )\n'
              )
              new = (
                  '    min_width = max(640, 54 + 180 + 48 * len(columns))\n'
                  '    colgroup = (\n'
                  '        \'<colgroup><col style="width:54px"><col style="width:180px">\'\n'
                  '        + \'\'.join(\'<col class="correlation-value-col" style="width:48px">\' for _ in columns)\n'
                  '        + \'</colgroup>\'\n'
                  '    )\n'
                  '    return (\n'
                  '        f\'<div class="table-wrap correlation-wrap" data-correlation-columns="{len(columns)}">\'\n'
                  '        f\'<table id="correlations-heatmap" class="heatmap monthly-correlations" \'\n'
                  '        f\'style="min-width:{min_width}px;table-layout:fixed">{colgroup}\'\n'
                  '        f"<thead><tr><th>Ticker</th><th>Name</th>{header}</tr></thead>"\n'
                  '        f"<tbody>{\'\'.join(rows)}</tbody></table></div>"\n'
                  '    )\n'
              )
              return replace_once(block, old, new, 'adaptive correlations')

          text = patch_function(text, 'correlations_table', correlations_transform)
          path.write_text(text, encoding='utf-8')

          # historical_active_components.py
          path = Path('src/portfolio_optimizer_kr/viewer/historical_active_components.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from . import historical_components as hc\n',
              'from . import asset_display as ad\nfrom . import historical_components as hc\n',
              'active import',
          )

          def stacked_transform(block: str) -> str:
              block = replace_once(
                  block,
                  '    chart_id: str,\n) -> str:\n',
                  '    chart_id: str,\n    color_map: dict[str, str] | None = None,\n) -> str:\n',
                  'stacked signature',
              )
              block = replace_once(
                  block,
                  '            color = hc.PALETTE[index % len(hc.PALETTE)]\n',
                  '            color = (color_map or {}).get(column, hc.PALETTE[index % len(hc.PALETTE)])\n',
                  'stacked mark color',
              )
              block = replace_once(
                  block,
                  '        hc.legend((label, hc.PALETTE[index % len(hc.PALETTE)]) for index, (_, label) in enumerate(series)),\n',
                  '        hc.legend((label, (color_map or {}).get(column, hc.PALETTE[index % len(hc.PALETTE)])) for index, (column, label) in enumerate(series)),\n',
                  'stacked legend color',
              )
              return block

          text = patch_function(text, '_stacked_contribution_chart', stacked_transform)

          def summary_transform(block: str) -> str:
              block = replace_once(
                  block,
                  'def _contribution_summary(part: pd.DataFrame, asset_names: dict[str, str]) -> str:\n',
                  'def _contribution_summary(part: pd.DataFrame, asset_names: dict[str, str], asset_order: list[str] | None = None) -> str:\n',
                  'summary signature',
              )
              block = replace_once(
                  block,
                  '    rows = []\n    for ticker, ticker_part in part.groupby(part["ticker"].astype(str)):\n        ticker_part = ticker_part.sort_values("date")\n',
                  '    rows = []\n    available = list(dict.fromkeys(part["ticker"].astype(str)))\n    ordered = [ticker for ticker in (asset_order or []) if ticker in available]\n    ordered.extend(ticker for ticker in available if ticker not in ordered)\n    for ticker in ordered:\n        ticker_part = part[part["ticker"].astype(str) == ticker].sort_values("date")\n',
                  'summary order',
              )
              return block

          text = patch_function(text, '_contribution_summary', summary_transform)

          def active_contribution_transform(block: str) -> str:
              old = (
                  '        pivot = part.pivot(index="date", columns="ticker", values="cumulative_active_contribution_pct").reset_index()\n'
                  '        series: list[tuple[str, str]] = []\n'
                  '        for ticker in pivot.columns:\n'
                  '            if ticker == "date":\n'
                  '                continue\n'
                  '            name = asset_names.get(str(ticker), "").strip()\n'
                  '            label = f"{name} ({ticker})" if name else str(ticker)\n'
                  '            series.append((str(ticker), label))\n'
              )
              new = (
                  '        pivot = part.pivot(index="date", columns="ticker", values="cumulative_active_contribution_pct").reset_index()\n'
                  '        global_order = list(asset_names)\n'
                  '        colors = ad.asset_color_map(global_order)\n'
                  '        available = [str(ticker) for ticker in pivot.columns if ticker != "date"]\n'
                  '        ordered = [ticker for ticker in global_order if ticker in available]\n'
                  '        ordered.extend(ticker for ticker in available if ticker not in ordered)\n'
                  '        series: list[tuple[str, str]] = []\n'
                  '        for ticker in ordered:\n'
                  '            name = asset_names.get(str(ticker), "").strip()\n'
                  '            label = f"{name} ({ticker})" if name else str(ticker)\n'
                  '            series.append((str(ticker), label))\n'
              )
              block = replace_once(block, old, new, 'active series order')
              block = replace_once(
                  block,
                  '            f\'{_stacked_contribution_chart(pivot, series, chart_id=f"active-contribution-{portfolio}")}\'\n'
                  '            f\'{_contribution_summary(part, asset_names)}</div>\'\n',
                  '            f\'{_stacked_contribution_chart(pivot, series, chart_id=f"active-contribution-{portfolio}", color_map=colors)}\'\n'
                  '            f\'{_contribution_summary(part, asset_names, global_order)}</div>\'\n',
                  'active chart call',
              )
              return block

          text = patch_function(text, 'active_contribution', active_contribution_transform)
          path.write_text(text, encoding='utf-8')

          # pv_round1_overlay.py
          path = Path('src/portfolio_optimizer_kr/viewer/pv_round1_overlay.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'from . import backtest_renderer as br\n',
              'from . import asset_display as ad\nfrom . import backtest_renderer as br\n',
              'overlay import',
          )

          def assets_transform(block: str) -> str:
              block = replace_once(
                  block,
                  '    currency: str,\n) -> str:\n',
                  '    currency: str,\n    asset_order: list[str],\n) -> str:\n',
                  'assets signature',
              )
              block = replace_once(
                  block,
                  '    asset_performance = _artifact(root, "portfolio_asset_performance.csv")\n'
                  '    annual_assets = _artifact(root, "annual_asset_returns.csv", raw_first=True)\n'
                  '    correlations = _artifact(root, "correlations.csv", raw_first=True)\n'
                  '    returns_decomp = _artifact(root, "return_decomposition.csv")\n'
                  '    risk_decomp = _artifact(root, "risk_decomposition.csv")\n',
                  '    asset_performance = ad.sort_asset_frame(_artifact(root, "portfolio_asset_performance.csv"), asset_order, ticker_column="ticker")\n'
                  '    annual_assets = ad.sort_asset_frame(_artifact(root, "annual_asset_returns.csv", raw_first=True), asset_order, ticker_column="ticker")\n'
                  '    correlations = _artifact(root, "correlations.csv", raw_first=True)\n'
                  '    returns_decomp = ad.sort_asset_frame(_artifact(root, "return_decomposition.csv"), asset_order, ticker_column="asset", strip_prefix="contribution_")\n'
                  '    risk_decomp = ad.sort_asset_frame(_artifact(root, "risk_decomposition.csv"), asset_order, ticker_column="asset")\n',
                  'assets frame order',
              )
              return block

          text = patch_function(text, '_assets_section', assets_transform)

          def apply_transform(block: str) -> str:
              block = replace_once(
                  block,
                  '    asset_names = _asset_names(configuration)\n    currency = _currency(configuration)\n',
                  '    base_asset_names = _asset_names(configuration)\n'
                  '    asset_order = ad.asset_display_order(result, base_asset_names)\n'
                  '    asset_names = ad.ordered_asset_names(base_asset_names, asset_order)\n'
                  '    currency = _currency(configuration)\n',
                  'overlay order init',
              )
              block = replace_once(
                  block,
                  '            asset_names,\n            currency,\n        ),\n',
                  '            asset_names,\n            currency,\n            asset_order,\n        ),\n',
                  'assets call',
              )
              block = replace_once(
                  block,
                  '        _MARKER + "\\n<style>.wide-detail-table{min-width:1850px}.asset-annual-responsive .chart-wrap{overflow-x:hidden}#risk-and-return-metrics td:first-child{white-space:nowrap}</style>\\n</head>",\n',
                  '        _MARKER + "\\n<style>"\n'
                  '        ".wide-detail-table{min-width:1850px}"\n'
                  '        ".asset-annual-responsive .chart-wrap{overflow-x:hidden}"\n'
                  '        "#risk-and-return-metrics td:first-child{white-space:nowrap}"\n'
                  '        ".correlation-wrap{overflow-x:auto}"\n'
                  '        ".correlation-wrap .monthly-correlations{width:100%}"\n'
                  '        ".correlation-wrap .heatmap-cell{min-width:0;padding-left:6px;padding-right:6px}"\n'
                  '        ".correlation-wrap th:nth-child(1),.correlation-wrap td:nth-child(1){width:54px;white-space:nowrap}"\n'
                  '        ".correlation-wrap th:nth-child(2),.correlation-wrap td:nth-child(2){width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}"\n'
                  '        ".correlation-wrap thead th:nth-child(n+3){white-space:normal;word-break:break-word;text-align:center;padding-left:4px;padding-right:4px}"\n'
                  '        "</style>\\n</head>",\n',
                  'correlation css',
              )
              return block

          text = patch_function(text, 'apply_backtest_round1_overlay', apply_transform)
          path.write_text(text, encoding='utf-8')

          # immutable validation run id
          path = Path('configs/backtest-pv-reference-parity.yaml')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'run_id: 20260903-backtest-pv-reference-parity-yty-v5\n',
              'run_id: 20260903-backtest-pv-reference-parity-yty-v6\n',
              'run id v6',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Add regression contract
        shell: bash
        run: |
          cat > tests/test_asset_display_order_contract.py <<'PY'
          import pandas as pd

          from portfolio_optimizer_kr.viewer import asset_display as ad
          from portfolio_optimizer_kr.viewer import backtest_renderer as br
          from portfolio_optimizer_kr.viewer import pv_visual as pv

          EXPECTED = ["QQQ", "SPY", "GLD", "XLE", "TLT", "AIA", "SLV", "XLF", "INDY", "EWJ", "EWY", "GDX"]
          NAMES = {
              "SPY": "State Street SPDR S&P 500 ETF",
              "GLD": "SPDR Gold Shares",
              "TLT": "iShares 20+ Year Treasury Bond ETF",
              "QQQ": "Invesco QQQ Trust",
              "SLV": "iShares Silver Trust",
              "GDX": "VanEck Gold Miners ETF",
              "AIA": "iShares Asia 50 ETF",
              "XLF": "Financial Select Sector SPDR Fund",
              "XLE": "Energy Select Sector SPDR Fund",
              "EWY": "iShares MSCI South Korea ETF",
              "EWJ": "iShares MSCI Japan ETF",
              "INDY": "iShares India 50 ETF",
          }

          def result_fixture():
              return {
                  "configuration": {"assets": [{"symbol": t, "name": n} for t, n in NAMES.items()]},
                  "portfolio_definitions": {
                      "Sample Portfolio": {"target_weights": {"SPY": .60, "GLD": .20, "TLT": .20}},
                      "Portfolio 2": {"target_weights": {"GLD": .10, "QQQ": .30, "SLV": .10, "GDX": .10, "AIA": .20, "XLF": .10, "XLE": .10}},
                      "Portfolio 3": {"target_weights": {"GLD": .10, "QQQ": .40, "SLV": .10, "EWY": .10, "XLE": .10, "EWJ": .10, "INDY": .10}},
                  },
              }

          def test_global_asset_order_and_unique_colors():
              assert ad.asset_display_order(result_fixture(), NAMES) == EXPECTED
              colors = ad.asset_color_map(EXPECTED)
              assert len(set(colors.values())) == len(EXPECTED)

          def test_target_allocation_uses_global_order():
              result = result_fixture()
              rows = []
              for portfolio, definition in result["portfolio_definitions"].items():
                  for ticker, name in NAMES.items():
                      rows.append({"portfolio": portfolio, "ticker": ticker, "name": name, "target_weight_pct": definition["target_weights"].get(ticker, 0) * 100})
              html = br._allocation_matrix(pd.DataFrame(rows), list(result["portfolio_definitions"]))
              assert [html.index(f"({ticker})") for ticker in EXPECTED] == sorted(html.index(f"({ticker})") for ticker in EXPECTED)

          def test_correlation_order_and_adaptive_width_contract():
              ordered_names = ad.ordered_asset_names(NAMES, EXPECTED)
              columns = EXPECTED + ["Sample Portfolio", "Portfolio 2", "Portfolio 3", "benchmark"]
              rows = []
              for ticker in EXPECTED:
                  row = {"series": ticker}
                  row.update({column: 1.0 if column == ticker else .25 for column in columns})
                  rows.append(row)
              html = pv.correlations_table(pd.DataFrame(rows), "SPY Benchmark", ordered_names, ["Sample Portfolio", "Portfolio 2", "Portfolio 3"])
              header = html.split('</thead>', 1)[0]
              body = html.split('<tbody>', 1)[1]
              assert [header.index(f'>{ticker}<') for ticker in EXPECTED] == sorted(header.index(f'>{ticker}<') for ticker in EXPECTED)
              assert [body.index(f'>{ticker}<') for ticker in EXPECTED] == sorted(body.index(f'>{ticker}<') for ticker in EXPECTED)
              assert 'data-correlation-columns="16"' in html
              assert 'min-width:1002px' in html

          def test_annual_asset_legend_uses_global_order_and_colors():
              ordered_names = ad.ordered_asset_names(NAMES, EXPECTED)
              frame = pd.DataFrame([{"year": 2025, "ticker": ticker, "return_pct": index + 1} for index, ticker in enumerate(reversed(EXPECTED))])
              html = pv.annual_asset_returns_chart(frame, ordered_names)
              labels = [f"{NAMES[ticker]} ({ticker})" for ticker in EXPECTED]
              assert [html.index(label) for label in labels] == sorted(html.index(label) for label in labels)
              colors = ad.asset_color_map(EXPECTED)
              assert all(colors[ticker] in html for ticker in EXPECTED)
          PY
      - name: Install and test
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m compileall -q src/portfolio_optimizer_kr
          python -m pytest -q \
            tests/test_asset_display_order_contract.py \
            tests/test_backtest_pv_round1.py \
            tests/test_pv_pagination_contract.py \
            tests/test_active_visual_reference_contract.py \
            tests/test_backtest_execution.py \
            tests/test_backtest_shared_end_to_end.py
      - name: Generate v6
        shell: bash
        run: |
          portfolio-optimizer validate configs/backtest-pv-reference-parity.yaml
          portfolio-optimizer run configs/backtest-pv-reference-parity.yaml --output-root runs
          test -f runs/20260903-backtest-pv-reference-parity-yty-v6/report.html
      - name: Browser validate
        shell: bash
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python -m http.server 8000 >/tmp/http.log 2>&1 &
          python - <<'PY'
          from playwright.sync_api import sync_playwright

          expected = ["QQQ", "SPY", "GLD", "XLE", "TLT", "AIA", "SLV", "XLF", "INDY", "EWJ", "EWY", "GDX"]
          url = 'http://127.0.0.1:8000/runs/20260903-backtest-pv-reference-parity-yty-v6/report.html'
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page(viewport={"width": 1440, "height": 1200})
              page.goto(url, wait_until='networkidle')

              allocation = page.locator('#allocation-matrix tbody tr td:first-child').all_inner_texts()
              assert [next(t for t in expected if f'({t})' in row) for row in allocation] == expected

              for table_id in ('annual-returns-detail', 'monthly-returns-detail'):
                  headers = page.locator(f'#{table_id} thead tr:first-child th').all_inner_texts()
                  assets = [next(t for t in expected if f'({t})' in text) for text in headers if any(f'({t})' in text for t in expected)]
                  assert assets == expected

              corr_rows = page.locator('#correlations-heatmap tbody tr td:first-child').all_inner_texts()
              assert corr_rows == expected
              corr_headers = page.locator('#correlations-heatmap thead th').all_inner_texts()
              assert corr_headers[2:14] == expected
              wrap = page.locator('.correlation-wrap')
              assert wrap.evaluate('(el) => el.scrollWidth <= el.clientWidth + 1')
              page.set_viewport_size({"width": 850, "height": 1200})
              assert wrap.evaluate('(el) => el.scrollWidth > el.clientWidth + 20')
              page.set_viewport_size({"width": 1440, "height": 1200})

              assert page.locator('#portfolio-assets tbody tr td:first-child').all_inner_texts() == expected
              assert page.locator('#portfolio-return-decomposition tbody tr td:first-child').all_inner_texts() == expected
              assert page.locator('#portfolio-risk-decomposition tbody tr td:first-child').all_inner_texts() == expected

              annual_items = page.locator('#assets .asset-annual-responsive .legend-item').all()
              annual_order = []
              annual_colors = {}
              for item in annual_items:
                  text = item.inner_text()
                  ticker = next(t for t in expected if f'({t})' in text)
                  annual_order.append(ticker)
                  annual_colors[ticker] = item.locator('i').evaluate('(el) => el.style.background')
              assert annual_order == expected

              sample_items = page.locator('.active-contribution-panel[data-portfolio="Sample Portfolio"] .legend-item').all()
              sample_order = []
              for item in sample_items:
                  text = item.inner_text()
                  ticker = next(t for t in expected if f'({t})' in text)
                  sample_order.append(ticker)
                  assert item.locator('i').evaluate('(el) => el.style.background') == annual_colors[ticker]
              assert sample_order == ["SPY", "GLD", "TLT"]
              browser.close()
          PY
