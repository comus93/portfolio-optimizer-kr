name: Probe remaining PV metric formulas once

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/probe-pv-metrics-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy
      - name: Probe withdrawal inflation timing
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path('runs/20260903-backtest-pv-reference-parity-yty-v2')
          annual = pd.read_csv(root/'raw/annual_returns_detail.csv').sort_values('year')
          names = ['Sample Portfolio','Portfolio 2','Portfolio 3','benchmark']
          targets = {
              'Sample Portfolio': (0.2034, 0.0811),
              'Portfolio 2': (0.2325, 0.1518),
              'Portfolio 3': (0.2414, 0.1467),
              'benchmark': (0.2261, 0.1101),
          }
          infl = annual['inflation'].fillna(0).to_numpy(float)
          years = annual['year'].to_numpy(int)
          before=np.ones(len(years)); after=np.ones(len(years))
          for i in range(1,len(years)):
              before[i]=before[i-1]*(1+infl[i-1])
          after=np.cumprod(1+infl)
          print('year inflation before after')
          print(list(zip(years,infl,before,after)))

          def rate(rr, factors, *, perpetual, withdraw_last, terminal_factor):
              lo,hi=0.,1.
              for _ in range(90):
                  w=(lo+hi)/2
                  bal=1.
                  ok=True
                  for i,ret in enumerate(rr):
                      bal*=1+float(ret)
                      if i < len(rr)-1 or withdraw_last:
                          bal-=w*float(factors[i])
                      if bal <= 0:
                          ok=False; break
                  if perpetual and ok:
                      ok=bal >= float(terminal_factor)
                  if ok: lo=w
                  else: hi=w
              return lo

          for name in names:
              rr=annual[f'series::{name}::return'].to_numpy(float)
              candidates={}
              for fname,factors in [('before',before),('after',after)]:
                  for last in [False, True]:
                      for terminal_name, terminal in [('before',before[-1]),('after',after[-1])]:
                          key=f'{fname}_last{int(last)}_terminal_{terminal_name}'
                          candidates[key]=(
                              rate(rr,factors,perpetual=False,withdraw_last=last,terminal_factor=terminal),
                              rate(rr,factors,perpetual=True,withdraw_last=last,terminal_factor=terminal),
                          )
              target=targets[name]
              ranked=sorted(candidates.items(), key=lambda kv: abs(kv[1][0]-target[0])+abs(kv[1][1]-target[1]))
              print('\n',name,'target',target)
              for key,value in ranked[:6]:
                  print(key, value, 'error', (value[0]-target[0], value[1]-target[1]))
          PY
