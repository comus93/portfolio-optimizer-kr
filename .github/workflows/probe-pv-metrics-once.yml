name: Probe remaining PV metric formulas once

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/probe-pv-metrics-once.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy
      - name: Probe remaining candidates
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          import numpy as np
          import pandas as pd

          root = Path('runs/20260903-backtest-pv-reference-parity-yty-v2')
          data = pd.read_csv(root/'raw/monthly_return_series.csv', parse_dates=['date']).set_index('date')
          annual = pd.read_csv(root/'raw/annual_returns_detail.csv').sort_values('year')
          result = json.loads((root/'result.json').read_text())
          config = result.get('configuration', {})
          names = ['Sample Portfolio','Portfolio 2','Portfolio 3','benchmark']
          rf_a = float((config.get('risk_free') or {}).get('effective_annual_rate') or 0.0)
          rf_m = (1+rf_a)**(1/12)-1
          print('rf annual/monthly', rf_a, rf_m)

          for name in names:
              r=data[name].astype(float)
              excess=r-rf_m
              downside_rf=np.sqrt(np.mean(np.minimum(excess.to_numpy(),0.0)**2))
              downside_zero=np.sqrt(np.mean(np.minimum(r.to_numpy(),0.0)**2))
              sort_rf=excess.mean()/downside_rf*math.sqrt(12)
              sort_zero=excess.mean()/downside_zero*math.sqrt(12)
              print(name,'sortino_downside_rf',sort_rf,'sortino_downside_zero',sort_zero,'downside_rf',downside_rf)

          infl = annual['inflation'].fillna(0).to_numpy(float)
          years = annual['year'].to_numpy(int)
          factors=np.ones(len(years))
          for i in range(1,len(years)):
              factors[i]=factors[i-1]*(1+infl[i-1])
          print('years/infl/factor_before_year',list(zip(years,infl,factors)))

          def withdrawal_rate(rr, perpetual=False, partial_fraction=0.0):
              lo,hi=0.,1.
              for _ in range(80):
                  rate=(lo+hi)/2
                  bal=1.
                  ok=True
                  for i,ret in enumerate(rr):
                      bal*=1+float(ret)
                      fraction=partial_fraction if i==len(rr)-1 else 1.0
                      bal-=rate*factors[i]*fraction
                      if bal<=0:
                          ok=False
                          break
                  if perpetual and ok:
                      terminal_inflation=factors[-1]*(1+infl[-1]*partial_fraction)
                      ok=bal>=terminal_inflation
                  if ok: lo=rate
                  else: hi=rate
              return lo

          for name in names:
              rr=annual[f'series::{name}::return'].to_numpy(float)
              print(name,'withdraw_candidates',{
                  'no_partial_safe': withdrawal_rate(rr,False,0.0),
                  'no_partial_pwr': withdrawal_rate(rr,True,0.0),
                  'half_partial_safe': withdrawal_rate(rr,False,0.5),
                  'half_partial_pwr': withdrawal_rate(rr,True,0.5),
                  '8of12_safe': withdrawal_rate(rr,False,8/12),
                  '8of12_pwr': withdrawal_rate(rr,True,8/12),
                  'full_partial_safe': withdrawal_rate(rr,False,1.0),
                  'full_partial_pwr': withdrawal_rate(rr,True,1.0),
              })
          PY
