name: Validate run navigation summaries

on:
  push:
    branches: [main]
    paths:
      - "src/portfolio_optimizer_kr/report/navigation.py"
      - "src/portfolio_optimizer_kr/report/public_links.py"
      - "src/portfolio_optimizer_kr/report/writer.py"
      - "src/portfolio_optimizer_kr/viewer/__init__.py"
      - "scripts/rebuild_run_navigation.py"
      - "scripts/register_public_report_url.py"
      - "tests/test_run_navigation.py"
      - "tests/test_run_public_links.py"
      - ".github/workflows/validate-run-navigation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile navigation runtime
        run: python -m compileall -q src/portfolio_optimizer_kr/report src/portfolio_optimizer_kr/viewer scripts/register_public_report_url.py scripts/rebuild_run_navigation.py

      - name: Run navigation and affected writer/viewer regression
        run: |
          python -m pytest -q \
            tests/test_run_navigation.py \
            tests/test_run_public_links.py \
            tests/test_run_output_layers.py \
            tests/test_reporting.py \
            tests/test_backtest.py \
            tests/test_backtest_execution.py \
            tests/test_backtest_shared_end_to_end.py
