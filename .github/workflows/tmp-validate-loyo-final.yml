name: Temporary final LOYO validation

on:
  push:
    branches: [feature/loyo-robustness-20260914]
    paths:
      - ".github/workflows/tmp-validate-loyo-final.yml"

permissions:
  contents: read

jobs:
  targeted-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/loyo-robustness-20260914
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          activate-environment: true
      - run: uv sync --frozen --extra dev
      - name: Compile runtime
        run: python -m compileall -q src/portfolio_optimizer_kr
      - name: Run affected regression
        run: |
          python -m pytest -q \
            tests/test_loyo_robustness.py \
            tests/test_optimizer.py \
            tests/test_optimization_engine.py \
            tests/test_target_volatility_contract.py \
            tests/test_reporting.py
