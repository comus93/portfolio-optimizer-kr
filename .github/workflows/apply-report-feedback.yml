name: Apply backtest report feedback

on:
  push:
    branches: [bt-module]
    paths:
      - ".github/workflows/apply-report-feedback.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: bt-module
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply report feedback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrence(s), found {actual}: {old[:80]!r}")
              target.write_text(text.replace(old, new, expected), encoding="utf-8")

          # One canonical display contract for places that combine an asset name and ticker.
          path = Path("src/portfolio_optimizer_kr/viewer/asset_display.py")
          text = path.read_text(encoding="utf-8")
          anchor = "\n\ndef asset_names_from_configuration(configuration: dict[str, Any]) -> dict[str, str]:\n"
          helper = '''\n\ndef asset_identity_label(name: Any, ticker: Any, *, separator: str = "\\n") -> str:\n    """Human-readable combined asset identity: name, then parenthesized ticker."""\n    ticker_text = str(ticker or "").strip()\n    name_text = str(name or "").strip()\n    return f"{name_text}{separator}({ticker_text})" if name_text else ticker_text\n\n\ndef asset_names_from_configuration(configuration: dict[str, Any]) -> dict[str, str]:\n'''
          if text.count(anchor) != 1:
              raise SystemExit("asset_display.py: helper insertion anchor changed")
          path.write_text(text.replace(anchor, helper, 1), encoding="utf-8")

          replace(
              "src/portfolio_optimizer_kr/viewer/historical_components.py",
              '''def legend(items: Iterable[tuple[str, str]]) -> str:\n    return '<div class="legend">' + "".join(\n        f'<span class="legend-item"><i style="background:{color}"></i>{esc(label)}</span>'\n        for label, color in items\n    ) + "</div>"\n''',
              '''def legend(items: Iterable[tuple[str, str]]) -> str:\n    def label_html(value: Any) -> str:\n        return esc(value).replace("\\n", "<br>")\n\n    return '<div class="legend">' + "".join(\n        f'<span class="legend-item"><i style="background:{color}"></i>'\n        f'<span class="legend-label">{label_html(label)}</span></span>'\n        for label, color in items\n    ) + "</div>"\n''',
          )

          replace(
              "src/portfolio_optimizer_kr/viewer/historical_active_components.py",
              '''            name = asset_names.get(str(ticker), "").strip()\n            label = f"{name} ({ticker})" if name else str(ticker)\n            series.append((str(ticker), label))\n''',
              '''            name = asset_names.get(str(ticker), "").strip()\n            label = ad.asset_identity_label(name, ticker)\n            series.append((str(ticker), label))\n''',
          )

          replace(
              "src/portfolio_optimizer_kr/viewer/pv_visual.py",
              '''        name = names.get(ticker, "").strip()\n        label = f"{name} ({ticker})" if name else ticker\n        series.append(\n''',
              '''        name = names.get(ticker, "").strip()\n        label = ad.asset_identity_label(name, ticker)\n        series.append(\n''',
          )

          replace(
              "src/portfolio_optimizer_kr/viewer/pv_visual.py",
              '''    if names:\n        asset_columns = [\n            key for key in names if key in frame.columns\n        ]\n    else:\n        asset_columns = [\n            column for column in frame.columns if column != "series"\n        ]\n\n    extra_columns = [\n        name\n        for name in (portfolio_order or [])\n        if name in frame.columns and name not in asset_columns\n    ]\n    if "benchmark" in frame.columns and "benchmark" not in asset_columns:\n        extra_columns.append("benchmark")\n    columns = asset_columns + [\n        column for column in extra_columns if column not in asset_columns\n    ]\n    if not columns:\n        columns = [\n            column for column in frame.columns if column != "series"\n        ]\n''',
              '''    if names:\n        # Monthly Correlations is an asset-to-asset matrix. Portfolio and\n        # benchmark series are intentionally excluded even when present in a\n        # legacy persisted correlation artifact. A benchmark ticker that is\n        # also a constituent remains here through the asset identity itself.\n        columns = [key for key in names if key in frame.columns]\n    else:\n        columns = [\n            column for column in frame.columns if column != "series"\n        ]\n    if not columns:\n        columns = [key for key in row_keys if key in frame.columns]\n''',
          )

          replace(
              "src/portfolio_optimizer_kr/backtest.py",
              '''    correlation = historical.correlations_table(\n        monthly_returns, paths, benchmark_returns\n    )\n''',
              '''    # Backtest Monthly Correlations is strictly constituent asset-to-asset.\n    # Portfolio paths and benchmark-relative behavior have dedicated analytics.\n    correlation = stats.correlation.copy()\n''',
          )

          replace(
              "src/portfolio_optimizer_kr/viewer/backtest_renderer.py",
              '''            f"{row.get('name')} ({row.get('ticker')})"\n            if pd.notna(row.get("name")) and str(row.get("name")).strip()\n''',
              '''            ad.asset_identity_label(row.get("name"), row.get("ticker"))\n            if pd.notna(row.get("name")) and str(row.get("name")).strip()\n''',
          )
          replace(
              "src/portfolio_optimizer_kr/viewer/backtest_renderer.py",
              '''.identity-cell {{ font-weight:500; }} .negative-value {{ color:#b42318; }}\n.monthly-correlations th {{ position:sticky; top:0; z-index:1; }}''',
              '''.identity-cell {{ font-weight:500; }} .negative-value {{ color:#b42318; }}\n#allocation-matrix td:first-child {{ white-space:pre-line; }}\n.legend-label {{ display:inline-block; line-height:1.25; text-align:left; }}\n.monthly-correlations th {{ position:sticky; top:0; z-index:1; }}''',
          )

          # Existing expectations: combined labels now have a deliberate line break.
          replace(
              "tests/test_backtest_report_presentation.py",
              '''    assert rendered.count("Invesco QQQ Trust (QQQ)") == 1\n    assert rendered.count("SPDR Gold Shares (GLD)") == 1\n    assert rendered.count("iShares 20+ Year Treasury (TLT)") == 1\n''',
              '''    assert rendered.count("Invesco QQQ Trust\\n(QQQ)") == 1\n    assert rendered.count("SPDR Gold Shares\\n(GLD)") == 1\n    assert rendered.count("iShares 20+ Year Treasury\\n(TLT)") == 1\n''',
          )

          replace(
              "tests/test_backtest_report_content_contract.py",
              '''    assert "Invesco QQQ Trust (QQQ)" in rendered\n    assert "SPDR Gold Shares (GLD)" in rendered\n''',
              '''    assert "Invesco QQQ Trust<br>(QQQ)" in rendered\n    assert "SPDR Gold Shares<br>(GLD)" in rendered\n''',
          )

          # Strengthen active-return identity and correlation scope acceptance.
          path = Path("tests/test_backtest_report_content_contract.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert "active-contribution-hover-zone" in rendered\n    assert "rolling-active-hover-zone" in rendered\n\n\ndef test_asset_performance_is_shared_finance_output_and_split_for_presentation():\n'''
          new = '''    assert "active-contribution-hover-zone" in rendered\n    assert "rolling-active-hover-zone" in rendered\n    assert "Invesco QQQ Trust<br>(QQQ)" in rendered\n    assert "SPDR Gold Shares<br>(GLD)" in rendered\n\n\ndef test_monthly_correlations_render_constituent_assets_only():\n    correlations = pd.DataFrame(\n        [\n            {"series": "QQQ", "QQQ": 1.0, "GLD": 0.20, "SPY": 0.85, "Growth 70/30": 0.94, "benchmark": 0.85},\n            {"series": "GLD", "QQQ": 0.20, "GLD": 1.0, "SPY": 0.10, "Growth 70/30": 0.31, "benchmark": 0.10},\n            {"series": "SPY", "QQQ": 0.85, "GLD": 0.10, "SPY": 1.0, "Growth 70/30": 0.91, "benchmark": 1.0},\n            {"series": "Growth 70/30", "QQQ": 0.94, "GLD": 0.31, "SPY": 0.91, "Growth 70/30": 1.0, "benchmark": 0.91},\n            {"series": "benchmark", "QQQ": 0.85, "GLD": 0.10, "SPY": 1.0, "Growth 70/30": 0.91, "benchmark": 1.0},\n        ]\n    )\n    rendered = _correlations_table(\n        correlations,\n        BENCHMARK,\n        {"QQQ": "Invesco QQQ Trust", "GLD": "SPDR Gold Shares", "SPY": "SPDR S&P 500 ETF Trust"},\n        ["Growth 70/30"],\n    )\n    for ticker in ("QQQ", "GLD", "SPY"):\n        assert f"<th>{ticker}</th>" in rendered\n    assert "Growth 70/30" not in rendered\n    assert html.escape(BENCHMARK) not in rendered\n\n\ndef test_asset_performance_is_shared_finance_output_and_split_for_presentation():\n'''
          if text.count(old) != 1:
              raise SystemExit("content contract active-return insertion anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Canonical Backtest artifact must also be asset-only, not only visually filtered.
          path = Path("tests/test_backtest_execution.py")
          text = path.read_text(encoding="utf-8")
          old = '''    assert "benchmark-relative" in html.lower()\n\n\ndef _make_research_repo(tmp_path: Path, *, benchmark_line: str = "") -> Path:\n'''
          new = '''    assert "benchmark-relative" in html.lower()\n\n    correlations = pd.read_csv(output / "raw" / "correlations.csv", dtype={"series": str})\n    assert list(correlations["series"]) == ["A", "B"]\n    assert list(correlations.columns) == ["series", "A", "B"]\n\n\ndef _make_research_repo(tmp_path: Path, *, benchmark_line: str = "") -> Path:\n'''
          if text.count(old) != 1:
              raise SystemExit("backtest execution correlation assertion anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # Show any remaining direct name-(ticker) composition in active Backtest viewer code.
          for candidate in Path("src/portfolio_optimizer_kr/viewer").glob("*.py"):
              body = candidate.read_text(encoding="utf-8")
              if ' ({ticker})' in body or " ({row.get('ticker')})" in body:
                  print(f"remaining combined identity candidate: {candidate}")
          PY

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused report regression
        run: |
          python -m pytest -q \
            tests/test_backtest_execution.py \
            tests/test_backtest_report_content_contract.py \
            tests/test_backtest_report_presentation.py \
            tests/test_backtest_shared_end_to_end.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-report-feedback.yml
          git add src tests
          git commit -m "fix: refine backtest asset identity and correlations"
          git push origin HEAD:bt-module
