name: One-off frontier UI polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-frontier-ui-polish.yml'

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Apply approved UI changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          dashboard_path = Path('src/portfolio_optimizer_kr/viewer/frontier_risk_dashboard.py')
          dashboard = dashboard_path.read_text(encoding='utf-8')
          dashboard = replace_once(
              dashboard,
              '#frontier-risk-dashboard .fr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}',
              '#frontier-risk-dashboard .fr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:12px}',
              'desktop frontier grid',
          )
          dashboard = replace_once(
              dashboard,
              '#frontier-risk-dashboard .fr-spark{width:100%;height:158px;display:block;background:#fff;touch-action:pan-y}',
              '#frontier-risk-dashboard .fr-spark{width:100%;height:220px;display:block;background:#fff;touch-action:pan-y}',
              'frontier chart height',
          )
          dashboard = replace_once(
              dashboard,
              '@media(max-width:780px){#frontier-risk-dashboard .fr-selected{grid-template-columns:1fr}}',
              '@media(max-width:780px){#frontier-risk-dashboard .fr-grid{grid-template-columns:1fr}#frontier-risk-dashboard .fr-spark{height:auto}#frontier-risk-dashboard .fr-selected{grid-template-columns:1fr}}',
              'mobile frontier layout',
          )
          dashboard = replace_once(
              dashboard,
              '  const xDomain = extentWithPadding(volatility);',
              "  const targetVolatility = Number(data.target_volatility_pct);\n  const hasTargetVolatility = data.objective === 'target_volatility' && Number.isFinite(targetVolatility);\n  const xDomain = extentWithPadding(hasTargetVolatility ? [...volatility, targetVolatility] : volatility);",
              'target volatility domain',
          )
          dashboard = replace_once(
              dashboard,
              '    const w=360,h=158,left=48,right=12,top=18,bottom=38;',
              '    const w=360,h=220,left=48,right=12,top=18,bottom=42;',
              'frontier viewbox height',
          )
          guide_anchor = "    svg.appendChild(svgText(ns,left,10,yLabel,{'font-size':'9','fill':'#64748b'}));\n    svg.appendChild(svgText(ns,left+plotW/2,h-5,'연환산 변동성 (%)',{'font-size':'9','fill':'#64748b','text-anchor':'middle'}));\n\n    const pts=[];"
          guide_replacement = "    svg.appendChild(svgText(ns,left,10,yLabel,{'font-size':'9','fill':'#64748b'}));\n    svg.appendChild(svgText(ns,left+plotW/2,h-5,'연환산 변동성 (%)',{'font-size':'9','fill':'#64748b','text-anchor':'middle'}));\n\n    if (hasTargetVolatility) {\n      const guideX=x(targetVolatility);\n      const guide=document.createElementNS(ns,'line');\n      guide.setAttribute('x1',guideX);guide.setAttribute('x2',guideX);guide.setAttribute('y1',top);guide.setAttribute('y2',h-bottom);\n      guide.setAttribute('stroke','#f59e0b');guide.setAttribute('stroke-width','1.4');guide.setAttribute('stroke-dasharray','5 4');guide.setAttribute('opacity','.95');\n      svg.appendChild(guide);\n      svg.appendChild(svgText(ns,Math.min(guideX+4,w-right-2),top+10,`Target ${targetVolatility.toFixed(2)}%`,{'font-size':'9','fill':'#b45309','text-anchor':guideX>w-right-82?'end':'start'}));\n    }\n\n    const pts=[];"
          dashboard = replace_once(dashboard, guide_anchor, guide_replacement, 'target volatility guide')
          dashboard_path.write_text(dashboard, encoding='utf-8')

          report_path = Path('site/report-template.html')
          report = report_path.read_text(encoding='utf-8')
          report = replace_once(
              report,
              ".empty { color:#718096; padding:30px 4px; } .overview { display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; } .pill { background:#e9effb; color:#244886; padding:4px 8px; border-radius:99px; font-size:12px; }",
              ".empty { color:#718096; padding:30px 4px; } .overview { display:flex; gap:18px; flex-wrap:wrap; align-items:baseline; } .pill { background:#e9effb; color:#244886; padding:4px 8px; border-radius:99px; font-size:19px; font-weight:700; line-height:1.25; }",
              'overview title pills',
          )
          report_path.write_text(report, encoding='utf-8')

          spec_path = Path('openspec/changes/2026-09-10-frontier-risk-tradeoff/specs/portfolio-optimization/spec.md')
          spec = spec_path.read_text(encoding='utf-8')
          axis_marker = "#### Scenario: same point stays synchronized\n- GIVEN 사용자가 어느 metric chart에서든 한 frontier point를 클릭한다\n- WHEN selected point가 변경된다\n- THEN 8개 metric chart의 marker, selected-point metrics, weights와 drawdown chart는 동일 point identity로 갱신되어야 한다\n"
          axis_addition = axis_marker + "\n### Requirement: 리스크·성과 균형 분석 responsive chart size\nDesktop report에서 8개 metric card는 최소 폭 360px을 기준으로 반응형 배치하고 각 chart의 기준 높이는 220px로 표시해야 한다(MUST). 780px 이하에서는 1열로 배치하고 chart는 viewBox 비율을 유지하며 폭에 맞게 축소되어야 한다(MUST).\n\n#### Scenario: desktop charts remain readable\n- GIVEN 충분한 폭의 PC Web report를 연다\n- WHEN 리스크·성과 균형 분석을 본다\n- THEN 기존 260px/158px 미니 차트보다 큰 카드와 plot 영역으로 표시된다\n"
          spec = replace_once(spec, axis_marker, axis_addition, 'responsive chart spec')

          objective_marker = "`target_volatility` dashboard에서 Maximum Sharpe point를 별도 보조 marker로 추가하지 않는다(MUST NOT). 사용자는 동일한 8개 curve를 탐색하되 이번 optimization objective가 선택한 point 하나만 강조해서 볼 수 있어야 한다.\n"
          objective_addition = objective_marker + "\n`target_volatility` dashboard의 8개 metric chart는 `target_volatility_pct`를 공통 X축의 고정 세로 점선 guideline으로 표시해야 한다(MUST). Guideline은 selected point marker와 시각적으로 구분되고 사용자가 다른 frontier point를 선택해도 이동하지 않아야 한다(MUST). `max_sharpe` dashboard에는 이 target-volatility guideline을 표시하지 않는다(MUST NOT).\n"
          spec = replace_once(spec, objective_marker, objective_addition, 'target volatility guideline spec')

          spec += "\n### Requirement: Optimization overview objective visibility\nOptimization report 상단의 objective와 benchmark 표시는 기존 pill/background 효과를 유지하면서 section heading과 동등한 19px bold typography로 보여야 한다(MUST).\n\n#### Scenario: objective and benchmark are prominent\n- GIVEN optimization report 상단 overview를 본다\n- WHEN objective 및 benchmark badge가 표시된다\n- THEN `Provided Portfolio` section heading과 비슷한 크기와 굵기로 읽을 수 있다\n"
          spec_path.write_text(spec, encoding='utf-8')

          tasks_path = Path('openspec/changes/2026-09-10-frontier-risk-tradeoff/tasks.md')
          tasks = tasks_path.read_text(encoding='utf-8')
          tasks += "\n- [x] Maximum Return 8개 metric chart에 고정 Target Volatility guideline 표시\n- [x] 리스크·성과 분석 desktop card 최소폭 360px / chart 높이 220px 및 mobile 1열 반응형 적용\n- [x] report 상단 objective / benchmark pill을 19px bold로 강화하고 기존 배경 효과 유지\n"
          tasks_path.write_text(tasks, encoding='utf-8')

          test_path = Path('tests/test_frontier_risk_dashboard.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '    assert "objective_label" in html\n'
          addition = marker + '    assert "minmax(360px,1fr)" in html\n    assert "height:220px" in html\n    assert "hasTargetVolatility" in html\n    assert "stroke-dasharray" in html\n    assert "Target ${targetVolatility.toFixed(2)}%" in html\n'
          test = replace_once(test, marker, addition, 'dashboard targeted assertions')
          test_path.write_text(test, encoding='utf-8')
          PY

      - name: Run targeted tests
        run: |
          python -m pip install -e . pytest
          pytest -q tests/test_frontier_risk_dashboard.py tests/test_optimizer_shared_historical_mount.py

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/oneoff-frontier-ui-polish.yml
          git add src/portfolio_optimizer_kr/viewer/frontier_risk_dashboard.py site/report-template.html tests/test_frontier_risk_dashboard.py openspec/changes/2026-09-10-frontier-risk-tradeoff/specs/portfolio-optimization/spec.md openspec/changes/2026-09-10-frontier-risk-tradeoff/tasks.md .github/workflows/oneoff-frontier-ui-polish.yml
          git commit -m 'feat: polish frontier target guide and chart sizing'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Generate fresh Maximum Return report
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run run-optimization.yml --ref main
