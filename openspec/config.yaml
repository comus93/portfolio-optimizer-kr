schema: spec-driven

context: |
  Project: portfolio-optimizer-kr, a Python 3.11 portfolio research system.
  Write OpenSpec artifacts in Korean.
  Portfolio Visualizer is an external reference, not a normative source.
  `openspec/specs/` is the canonical baseline for capabilities already migrated into OpenSpec.
  As of 2026-09-04, the finance/calculation/product semantics previously owned by docs/specification.md have been migrated into OpenSpec baseline capabilities.
  docs/specification.md is now a compatibility pointer and capability map, not a normative finance specification.
  For capabilities not yet fully migrated, preserve applicable semantics from the remaining internal migration baselines:
  - docs/report-ui-specification.md for report UI/interaction behavior
  - docs/input-ui-contract.md for input/YAML/runner/viewer behavior
  - docs/architecture.md for architecture and responsibility boundaries
  - docs/visual-acceptance-contract.md for validation procedure and completion checks
  - docs/research-operation-pipeline.md for user research execution behavior
  - docs/llm-research-input-contract.md for LLM/User research input behavior
  - docs/llm-analysis-framework.md for product-mode-specific LLM analysis execution guidance
  Historical correction/reference documents may inform parity review only when consistent with the current canonical OpenSpec and remaining migration baselines.
  External references such as Portfolio Visualizer may fill product-design gaps but must not override existing internal contracts automatically.
  Target product capabilities are portfolio-optimization and portfolio-backtest.
  Shared finance/presentation capabilities are market-data, portfolio-simulation, portfolio-analytics, run-artifacts, and research-report.
  Research/tooling capabilities may include research-execution, research-input, research-analysis, and agent-verification when a change introduces observable workflow or verification behavior.
  Product specs define product-specific behavior; shared rules and formulas live only in the shared capability that owns them.
  A shared capability change must identify affected product capabilities and the required affected-scope regression.
  Keep scope concise and avoid restating the same constraint in multiple forms.

rules:
  proposal:
    - Separate product behavior from tooling/process changes.
    - Identify shared capability changes separately from product-specific changes.
    - Keep scope and impact concise.
  specs:
    - Define observable behavior and testable scenarios, not implementation steps.
    - State financial formulas explicitly when they are part of the behavior contract.
    - Treat `openspec/specs/` as canonical for migrated capabilities.
    - Preserve applicable semantics from remaining migration-baseline docs only for capabilities not yet fully migrated.
    - Do not duplicate a shared formula or acceptance rule in portfolio-optimization and portfolio-backtest specs.
    - Keep research/tooling capability behavior separate from finance formulas unless the behavior directly changes a finance contract.
  design:
    - Reuse existing data, portfolio, analytics, report, viewer, YAML runner, research execution, and persistence layers before creating parallel implementations.
    - Map applicable existing internal design/architecture contracts to the owning OpenSpec capability or design decision.
    - For shared changes, document impact on both portfolio-optimization and portfolio-backtest when applicable.
  tasks:
    - Prefer affected-scope tests during iteration and include real-run/browser checks when the change needs them.
    - Include regression tasks for every existing product capability affected by a shared capability change.
    - Include parity review against applicable canonical OpenSpec and remaining migration-baseline docs before completion.

operations:
  apply:
    guidance:
      - Follow AGENTS.md and ai-share/PROTOCOL.md.
      - Do not change requirements or acceptance criteria merely to make validation pass.
