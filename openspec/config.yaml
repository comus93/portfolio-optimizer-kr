schema: spec-driven

context: |
  Project: portfolio-optimizer-kr, a Python 3.11 portfolio research system.
  Write OpenSpec artifacts in Korean.
  Portfolio Visualizer is an external reference, not a normative source.
  Existing detailed contracts remain in docs/ until the relevant capability is migrated into OpenSpec.
  Keep scope concise and avoid restating the same constraint in multiple forms.

rules:
  proposal:
    - Separate product behavior from tooling/process changes.
    - Keep scope and impact concise.
  specs:
    - Define observable behavior and testable scenarios, not implementation steps.
    - State financial formulas explicitly when they are part of the behavior contract.
  design:
    - Reuse existing data, portfolio, analytics, report, and viewer layers before creating parallel implementations.
  tasks:
    - Prefer affected-scope tests during iteration and include real-run/browser checks when the change needs them.

operations:
  apply:
    guidance:
      - Follow AGENTS.md and ai-share/PROTOCOL.md.
      - Do not change requirements or acceptance criteria merely to make validation pass.
