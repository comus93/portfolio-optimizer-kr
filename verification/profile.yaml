version: 1
change: bt-module

openspec:
  - npx -y @fission-ai/openspec@latest validate bt-module --strict
  - npx -y @fission-ai/openspec@latest validate migrate-optimizer-to-openspec --strict

tests:
  targeted:
    - pytest -q tests/test_backtest.py tests/test_backtest_execution.py tests/test_backtest_input_persistence.py tests/test_backtest_scope.py
    - pytest -q tests/test_data.py tests/test_verification_profile.py
  affected_regression:
    - pytest -q tests/test_portfolio.py tests/test_runner.py tests/test_research.py
  completion:
    - pytest -q

real_run:
  config: configs/backtest-example.yaml
  requirements:
    - use a unique run_id and do not overwrite an existing run
    - verify result.json, raw/, review/, report.html
    - verify portfolio identities and actual initial balance
    - verify FinanceDataReader asset data uses explicit total-return-capable series

browser:
  required_for_report_changes: true
  engine: playwright-chromium
  one_time_setup:
    - npm install
    - npx playwright install chromium
  fixture_command: npm run verify:browser
  real_report_command: npx playwright test
  real_report_env: BACKTEST_REPORT_PATH
  evidence:
    - Playwright HTML report under playwright-report/
    - traces and failure screenshots under test-results/playwright/
    - passing desktop/mobile screenshots emitted into each Playwright test output directory
  checks:
    - Summary exposes time period, requested/effective period, initial amount, benchmark, rebalancing, calendar alignment, and return semantics
    - Summary keeps target allocation, Performance Summary, Portfolio Growth, and Trailing Returns in the primary result flow
    - target allocation exposes readable portfolio, asset, and target-weight identities
    - growth chart contains portfolio identity, date, and actual balance semantics
    - growth chart exposes multiple intermediate x/y ticks, horizontal grid references, and semantic axis titles
    - growth chart exposes visible mouse-hover and keyboard-focus inspect feedback with date, portfolio identity, and balance
    - result navigation separates Summary, conditional Active Returns, Metrics, Annual Returns, Monthly Returns, Drawdowns, Assets, and Rolling Returns
    - optimization-only Efficient Frontier and Optimized Portfolio identity are absent
    - unsupported Style Analysis and Factor Regression are not fabricated
    - benchmark-relative section is present only when benchmark is configured
    - 390px viewport has no document-level horizontal clipping
    - overflowing tables and growth chart remain horizontally scrollable rather than clipping information

publishing:
  required_for_material_report_changes: true
  workflow: .github/workflows/publish-reports.yml
  requirements:
    - persist the representative validation run under runs/<run-id>/ and commit/push it
    - verify the GitHub Pages deployment completes successfully
    - record the exact published report URL in validation evidence and agent handoff
    - do not use a local file path or screenshot as the sole visual-acceptance target

visual_acceptance:
  when: material_layout_or_interaction_change
  first_pass:
    owner: LLM
    basis:
      - published GitHub Pages report
      - captured Portfolio Visualizer MHTML reference
      - OpenSpec research-report and applicable internal report contracts
    checks:
      - information architecture and section grouping
      - output data character and applicable result domains
      - chart axis/legend/tooltip semantics
      - obvious functional or information-loss mismatch before aesthetic review
  second_pass:
    owner: user
    basis:
      - published GitHub Pages report after first-pass blockers are resolved
    checks:
      - usability, layout balance, readability, and subjective polish
  rule: Agent and automated Playwright checks prepare evidence but do not own final visual acceptance

rules:
  - do not weaken, skip, or rewrite requirements/tests to make verification pass
  - implementation fixes are allowed; requirement changes require a blocker report
  - shared market-data or simulation changes require affected Optimization regression
  - Playwright pixel-diff parity with Portfolio Visualizer is not an acceptance criterion
