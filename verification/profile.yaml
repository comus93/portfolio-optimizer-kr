version: 1
change: bt-module

openspec:
  - npx -y @fission-ai/openspec@latest validate bt-module --strict
  - npx -y @fission-ai/openspec@latest validate migrate-optimizer-to-openspec --strict

tests:
  targeted:
    - pytest -q tests/test_backtest.py tests/test_backtest_execution.py tests/test_backtest_input_persistence.py tests/test_backtest_scope.py
    - pytest -q tests/test_data.py tests/test_verification_profile.py
  affected_regression:
    - pytest -q tests/test_portfolio.py tests/test_runner.py tests/test_research.py
  completion:
    - pytest -q

real_run:
  config: configs/backtest-example.yaml
  requirements:
    - use a unique run_id and do not overwrite an existing run
    - verify result.json, raw/, review/, report.html
    - verify portfolio identities and actual initial balance
    - verify FinanceDataReader asset data uses explicit total-return-capable series

browser:
  required_for_report_changes: true
  engine: playwright-chromium
  one_time_setup:
    - npm install
    - npx playwright install chromium
  fixture_command: npm run verify:browser
  real_report_command: npx playwright test
  real_report_env: BACKTEST_REPORT_PATH
  evidence:
    - Playwright HTML report under playwright-report/
    - traces and failure screenshots under test-results/playwright/
    - passing desktop/mobile screenshots emitted into each Playwright test output directory
  checks:
    - Backtest overview exposes time period, requested/effective period, initial amount, benchmark, rebalancing, calendar alignment, and return semantics
    - target allocation exposes readable portfolio, ticker, and target-weight identities
    - growth chart contains portfolio identity, date, and actual balance semantics
    - optimization-only Efficient Frontier and Optimized Portfolio identity are absent
    - benchmark-relative section is present only when benchmark is configured
    - required report sections are present when applicable
    - 390px viewport has no document-level horizontal clipping
    - overflowing tables and growth chart remain horizontally scrollable rather than clipping information

human_visual_review:
  when: material_layout_or_interaction_change
  evidence_source: Playwright desktop/mobile screenshots
  rule: Agent may prepare evidence and severity observations, but the human reviewer owns the visual acceptance decision

rules:
  - do not weaken, skip, or rewrite requirements/tests to make verification pass
  - implementation fixes are allowed; requirement changes require a blocker report
  - shared market-data or simulation changes require affected Optimization regression
  - Playwright pixel-diff parity with Portfolio Visualizer is not an acceptance criterion
